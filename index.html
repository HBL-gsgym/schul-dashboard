<script>
/* HBL Schul-Dashboard v5.0 – personal timetable + automatic per-block participation dates.
   Public demonstration only. All state is part of the existing per-user Cloud JSON snapshot. */
(function(){
'use strict';
const STORE_KEY='__timetableV1';
window.hblTimetableEditing=false;
const WORKDAYS=['','Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];
let openEditor=null,managerOpen=false;
const byId=id=>document.getElementById(id);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lower=s=>String(s??'').trim().replace(/\s+/g,' ').toLocaleLowerCase('de-DE');
const normalizedCourseSubject=HblCourseIds.subject;
const courseId=HblCourseIds.id;
function subjectSymbol(subject){const x=normalizedCourseSubject(subject);return x==='ma'?['math','➗']:x==='ph'||x==='gkph1'?['physics','⚛️']:x==='astro'?['astro','🔭']:x==='wat'?['wat','🛠️']:['neutral','📘'];}
function courseMeta(entry){const id=courseId(entry),[type,icon]=subjectSymbol(entry.subject);
 return {id,label:entry.subject,group:entry.group,short:`${entry.subject} ${entry.group}`,subject:type,icon};}
function normalizedEntry(entry){if(!entry||typeof entry!=='object')return null;
 const subject=String(entry.subject||'').trim().slice(0,60),group=String(entry.group||'').trim().slice(0,30),room=String(entry.room||'').trim().slice(0,40);
 return subject&&group?{subject,group,room,...(HblCourseIds.valid(entry.courseId)?{courseId:entry.courseId}:{})}:null;
}
function getSettings(){const data=prepDone?.[STORE_KEY];
 if(!data||!Array.isArray(data.slots)&&(!data.slots||typeof data.slots!=='object'))return {version:1,slots:{}};
 return {version:data.version||1,slots:data.slots};
}
function emptySchedule(){return {A:{1:{},2:{},3:{},4:{},5:{}},B:{1:{},2:{},3:{},4:{},5:{}}};}
function getCourseCatalog(){return HblCourses.reconcile(prepDone.__coursesV1,getSettings().slots,prepDone.__participation?.classes,HBL_SAMPLE_COURSES);}
window.hblReadCourses=()=>({catalog:getCourseCatalog(),slots:slotsCopy()});
window.hblWriteCourses=async function(catalog){
 if(!serverReady)throw Error("Speicher noch nicht bereit. Bitte Seite neu laden.");
 prepDone.__coursesV1=catalog;
 if(prepDone[STORE_KEY]?.slots)prepDone[STORE_KEY].slots=HblCourses.align(getSettings().slots,catalog);
 hblApplyTimetable();reconcileAll();renderParticipationOverview();renderParticipationTable();
 await savePrepFile();
};
function activeEntries(settings){
 const list=new Map();
 for(let day=1;day<=5;day++)for(let block=1;block<=4;block++){
  const slot=settings.slots[day+'-'+block];
  if(!slot||typeof slot!=='object')continue;
  for(const week of ['A','B']){
   const entry=normalizedEntry(slot[week]);if(!entry)continue;
   list.set(courseId(entry),courseMeta(entry));
  }
 }
 return list;
}
function courseHasSavedData(c){return !!(c&&((Array.isArray(c.students)&&c.students.length)||Object.keys(c.marks||{}).length||Object.keys(c.finals||{}).length||c.dates?.some(x=>x.manual||!x.auto)));}
function hblUpdateCurrentCourse(){
 if(!currentParticipationCourse)return;
 const c=partCourseById(currentParticipationCourse);
 const title=byId('hblCurrentCourseTitle');
 if(title&&c)title.innerHTML=`${c.icon} ${escapeHtml(c.label)} <span>· ${escapeHtml(c.group)}</span>`;
 const tabs=byId('hblCourseTabs');
 if(tabs)tabs.innerHTML=PARTICIPATION_COURSES.map(x=>`<a class="part-tab ${x.id===currentParticipationCourse?'current':''}" href="?mitarbeit=${encodeURIComponent(x.id)}">${escapeHtml(x.short)}</a>`).join('');
 const sub=byId('partHeroStats');if(sub){const root=prepDone.__participation?.classes||{};sub.textContent=participationInfo(root[currentParticipationCourse]);}
 if(c)document.title=`Mitarbeit ${c.short} · Schul-Dashboard`;
}
function hblApplyTimetable(){
 const data=getSettings(),timetable=emptySchedule();
 for(let day=1;day<=5;day++)for(let block=1;block<=4;block++){
  const slot=data.slots[day+'-'+block];
  if(!slot)continue;
  for(const week of ['A','B']){
   const entry=normalizedEntry(slot[week]);if(!entry)continue;
   for(const hour of BLOCKS[block-1].hours)timetable[week][day][hour]=[entry.subject,entry.group,entry.room];
  }
 }
 TIMETABLE=timetable;
 refreshTaskCourses();
 const catalog=getCourseCatalog(),courses=new Map();
 for(const [id,c] of Object.entries(catalog.courses)){
  if(c.archived&&id!==currentParticipationCourse)continue;
  courses.set(id,{...courseMeta({...c,courseId:id}),archived:c.archived});
 }
 PARTICIPATION_COURSES.splice(0,PARTICIPATION_COURSES.length,...[...courses.values()].sort((a,b)=>a.short.localeCompare(b.short,'de')));
 renderTimetable();renderToday();renderPreparationWeeks();renderParticipationOverview();hblUpdateCurrentCourse();
}
function plannedSlots(course){
 const year=currentSchoolYear(new Date()),holidays=new Map([...publicHolidays(new Date(year.start+"T12:00:00").getFullYear()),...publicHolidays(new Date(year.end+"T12:00:00").getFullYear())]),result=[];
 if(!year)return result;
 for(let date=parseSchoolDate(year.start);taskDateString(date)<=year.end;date=dayOffset(date,1)){
  const day=date.getDay();if(day<1||day>5)continue;
  const dateKey=taskDateString(date);
  if(schoolDateDescription(dateKey,year,holidays).kind!=='school')continue;
  const plan=TIMETABLE[weekCycle(date)]?.[day]||{};
  for(const block of BLOCKS){
   const entry=getSettings().slots[day+'-'+block.n]?.[weekCycle(date)];
   const matched=entry&&courseId(entry)===course;
   if(matched&&!(typeof window.hblCancelled==="function"&&window.hblCancelled(dateKey,block.n)))result.push({date:dateKey,block:block.n});
  }
 }
 return result;
}
function dateHasMarks(c,id){return Object.values(c.marks||{}).some(m=>{const x=m?.[id];return x&&(x.rating||x.comment);});}
function reconcileDates(c,id){
 if(!Array.isArray(c.dates))c.dates=[];
 if(!Array.isArray(c.excludedAuto))c.excludedAuto=[];
 const excluded=new Set(c.excludedAuto),wanted=plannedSlots(id).filter(v=>!excluded.has(v.date+'|'+v.block));
 const need=new Map(wanted.map(v=>[v.date+'|'+v.block,v]));let changed=false;
 // Migrate previous 'one date per school day' columns without dropping associated grades.
 for(const d of c.dates){
  if(d.manual || d.block || !/^auto-\d{4}-\d{2}-\d{2}$/.test(String(d.id)))continue;
  const first=wanted.find(w=>w.date===d.date&&need.has(w.date+'|'+w.block));
  if(first){d.block=first.block;d.auto=true;need.delete(first.date+'|'+first.block);changed=true;}
  else if(dateHasMarks(c,d.id)){d.manual=true;d.auto=false;d.archived=true;changed=true;}
  else {d.block=-1;d.auto=true;changed=true;}
 }
 const retained=[];
 for(const d of c.dates){
  if(d.block && d.auto && !d.manual){
   const key=d.date+'|'+d.block;
   if(need.has(key)){need.delete(key);retained.push(d);continue;}
   if(wanted.some(w=>w.date===d.date&&w.block===d.block)){retained.push(d);continue;}
   if(dateHasMarks(c,d.id)){d.manual=true;d.auto=false;d.archived=true;retained.push(d);changed=true;}
   else {for(const marks of Object.values(c.marks||{}))delete marks[d.id];changed=true;}
  }else retained.push(d);
 }
 for(const {date,block} of need.values()){
  retained.push({id:`auto-${date}-b${block}`,date,block,auto:true});changed=true;
 }
 retained.sort((a,b)=>a.date.localeCompare(b.date)||(a.block||0)-(b.block||0));
 if(retained.length!==c.dates.length)changed=true;
 c.dates=retained;
 return changed;
}
window.hblPlannedSlots=plannedSlots;
window.hblReconcileCourseDates=reconcileDates;
function reconcileAll(){
 // Existing v3/v4 users have pre-calculated sessions but no custom timetable yet.
 // Do not touch their historical dates until they explicitly save/import a timetable.
 if(!prepDone[STORE_KEY] || typeof prepDone[STORE_KEY] !== 'object')return false;
 const active=activeEntries(getSettings());
 if(!active.size && !Object.keys(prepDone.__participation?.classes||{}).length)return false;
 const root=getParticipationRoot();let changed=false;
 for(const [id,meta] of active){
  if(!root.classes[id]){root.classes[id]={students:[],dates:[],marks:{},finals:{},meta};changed=true;}
  const c=root.classes[id];
  if(JSON.stringify(c.meta)!==JSON.stringify(meta)){c.meta=meta;changed=true;}
  if(reconcileDates(c,id))changed=true;
 }
 // Removed but previously graded courses keep their old dates. Unrated orphan dates are dropped.
 for(const [id,c] of Object.entries(root.classes))if(!active.has(id)&&reconcileDates(c,id))changed=true;
 return changed;
}
window.hblScheduleAfterLoad=function(){
 let migrated=false;
 const settings=prepDone[STORE_KEY];
 if(settings?.slots){
  const slots=HblCourseIds.ensure(settings.slots,{migrate:true});
  migrated=JSON.stringify(slots)!==JSON.stringify(settings.slots);
  if(migrated)prepDone[STORE_KEY]={...settings,version:2,slots};
 }
 const catalog=getCourseCatalog();
 if(JSON.stringify(catalog)!==JSON.stringify(prepDone.__coursesV1)){prepDone.__coursesV1=catalog;migrated=true;}
 if(prepDone[STORE_KEY]?.slots){
  const aligned=HblCourses.align(getSettings().slots,catalog);
  if(JSON.stringify(aligned)!==JSON.stringify(getSettings().slots)){prepDone[STORE_KEY].slots=aligned;migrated=true;}
 }
 hblApplyTimetable();
 const reconciled=reconcileAll();
 if(serverReady&&coursePageId&&Object.hasOwn(catalog.courses,coursePageId)){
  const classes=getParticipationRoot().classes;
  const data=classes[coursePageId]??={students:[],dates:[],marks:{},finals:{}};
  if(initializeCourseStudents(data))migrated=true;
 }
 HblCoursePage.refresh();
 if(migrated||reconciled){
  renderParticipationOverview();renderParticipationTable();
  if(serverReady && !window.hblScheduleWriting)savePrepFile().catch(()=>{});
 }
};async function persistSchedule(slots){
 if(!serverReady){alert('Speicher noch nicht bereit. Bitte Seite neu laden.');return false;}
 window.hblScheduleWriting=true;
 try{
  const catalog=getCourseCatalog();
  const identified=HblCourseIds.ensure(slots,{knownSlots:getSettings().slots,classes:HblCourses.identityClasses(catalog,prepDone.__participation?.classes)});
  const next=HblCourses.reconcile(catalog,identified,prepDone.__participation?.classes,HBL_SAMPLE_COURSES);
  for(const pair of Object.values(identified))for(const w of ['A','B'])if(pair?.[w])next.courses[courseId(pair[w])].archived=false;
  prepDone.__coursesV1=next;
  prepDone[STORE_KEY]={version:2,slots:HblCourses.align(identified,next)};
  hblApplyTimetable();reconcileAll();renderParticipationOverview();renderParticipationTable();
  await savePrepFile();
 }catch(e){alert('Speichern fehlgeschlagen: '+e.message);return false;}
 finally{window.hblScheduleWriting=false;}
 return true;
}
function slotsCopy(){return JSON.parse(JSON.stringify(getSettings().slots));}
function ensureModal(){
 if(byId('hblPlanOverlay'))return;
 const overlay=document.createElement('div');overlay.id='hblPlanOverlay';overlay.className='hbl-plan-overlay';overlay.hidden=true;
 overlay.innerHTML=`<section class="hbl-plan-dialog" role="dialog" aria-modal="true" aria-labelledby="hblPlanDialogTitle">
  <button class="hbl-plan-close" type="button" id="hblPlanClose" aria-label="Schließen">✕</button>
  <div class="hbl-plan-eyebrow">INDIVIDUELLER STUNDENPLAN</div><h2 id="hblPlanDialogTitle">Block bearbeiten</h2>
  <div class="hbl-plan-current"><div id="hblPlanPreviewA"></div><div id="hblPlanPreviewB"></div></div>
  <form id="hblPlanForm">
  <label>Kurs auswählen <select id="hblPlanCourse"></select></label>
  <p class="hbl-plan-info">Wähle aus deinen Kursen oder lege hier einen neuen an. Bestehende Kurse bearbeitest du unter „Meine Kurse“.</p>
  <label>Gültigkeit <select id="hblPlanWeek"><option value="both">A und B – beide Wochen</option><option value="A">Nur A – grün</option><option value="B">Nur B – blau</option></select></label>
  <div class="hbl-plan-form-grid"><label id="hblPlanSubjectWrap">Fach <input id="hblPlanSubject" type="text" maxlength="60" placeholder="z. B. Mathematik" required autocomplete="off"></label>
  <label id="hblPlanGroupWrap">Klasse / Kurs <input id="hblPlanGroup" type="text" maxlength="30" placeholder="z. B. 9a" required autocomplete="off"></label>

  <div class="hbl-plan-buttons"><button class="hbl-plan-primary" type="submit">Belegung speichern</button><button type="button" id="hblPlanDelete">Belegung entfernen</button><button type="button" id="hblPlanCancel">Abbrechen</button></div></form>
  </section>`;
 document.body.appendChild(overlay);
 const close=()=>{overlay.hidden=true;openEditor=null;};
 byId('hblPlanClose').onclick=close;byId('hblPlanCancel').onclick=close;
 overlay.addEventListener('click',e=>{if(e.target===overlay)close();});
 overlay.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();close();}});
 byId('hblPlanWeek').onchange=()=>{
  const fresh=byId('hblPlanCourse').value==='__new__';

  fillEditor();
  if(fresh&&(draft.subject||draft.group)){

   byId('hblPlanSubject').value=draft.subject;byId('hblPlanGroup').value=draft.group;byId('hblPlanRoom').value=draft.room;
  }
 };
 byId('hblPlanCourse').onchange=updateCourseFields;
 byId('hblPlanForm').onsubmit=async e=>{
  e.preventDefault();if(!openEditor)return;
  const v={subject:byId('hblPlanSubject').value.trim(),group:byId('hblPlanGroup').value.trim(),room:byId('hblPlanRoom').value.trim()};
  if(!v.subject||!v.group){alert('Fach und Klasse/Kurs müssen ausgefüllt sein.');return;}
  const original=slotsCopy(),slot=original[openEditor.day+'-'+openEditor.block]||{},week=byId('hblPlanWeek').value;
  if(week==='both'&&slot.A&&slot.B&&JSON.stringify(slot.A)!==JSON.stringify(slot.B)&&!confirm('In A und B stehen unterschiedliche Belegungen. Wirklich beide durch denselben Eintrag ersetzen?'))return;
  try{
   const selected=byId('hblPlanCourse').value,catalog=getCourseCatalog();
   let slots;
   if(selected==='__new__'){
    const result=HblCourses.update(catalog,{subject:v.subject,group:v.group},original);
    // Register only after successful validation of the full block assignment.
    slots=HblCourses.assign(original,result.catalog,result.id,{...openEditor,week,room:v.room});
   }else slots=HblCourses.assign(original,catalog,selected,{...openEditor,week,room:v.room});
   if(await persistSchedule(slots))close();
  }catch(error){alert(error.message);}
 };
 byId('hblPlanDelete').onclick=async()=>{
  if(!openEditor)return;

  if(week==='both'){delete slot.A;delete slot.B;}else delete slot[week];
  if(!slot.A&&!slot.B)delete slots[key];else slots[key]=slot;

}
function updateCourseFields(){

 const v=week==='both'?(slot.A||slot.B):slot[week];

  const v=slot[w];byId('hblPlanPreview'+w).innerHTML=`<b>Woche ${w}</b><span>${v?`${escapeHtml(v.subject)} · ${escapeHtml(v.group)} · ${escapeHtml(v.room||'ohne Raum')}`:'frei'}</span>`;
 }
 const same=slot.A&&slot.B&&JSON.stringify(slot.A)===JSON.stringify(slot.B);
 byId('hblPlanWeek').value=same||(!slot.A&&!slot.B)?'both':slot.A?'A':'B';
 fillEditor();byId('hblPlanOverlay').hidden=false;byId('hblPlanCourse').focus();
};
function makeSampleSlots(){
 const slots={};
 for(let day=1;day<=5;day++)for(let block=1;block<=4;block++){
  const pair={};
  for(const w of ['A','B']){
   const entries=BLOCKS[block-1].hours.map(h=>HBL_SAMPLE_TIMETABLE[w]?.[day]?.[h]).filter(Boolean);
   if(!entries.length)continue;
   const [subject,group,room]=entries[0];pair[w]={subject,group,room};
  }
  if(pair.A||pair.B)slots[day+'-'+block]=pair;
 }
 return slots;
}
window.hblImportSamplePlan=async function(){
 const count=Object.keys(getSettings().slots).length;
 if(count && !confirm('Der aktuelle Stundenplan wird durch den bisherigen HBL-Musterplan ersetzt. Vorhandene Bewertungen bleiben erhalten. Fortfahren?'))return;
 if(await persistSchedule(makeSampleSlots())){hblOpenPlanManager(false);}
};

/* v5.4 – Stundenplan-Dateiaustausch, ausschließlich im eigenen Cloud-Profil. */
function hblScheduleRows(slots){
 const rows=[];
 for(let d=1;d<=5;d++)for(let b=1;b<=4;b++){
  const slot=slots[d+'-'+b]||{};
  for(const w of ['A','B']){const v=normalizedEntry(slot[w]);if(v)rows.push({day:d,block:b,week:w,...v});}
 }
 return rows;
}
function hblScheduleCsvCell(value){
 const str=String(value??'');
 const safe=/^[=+@\-\t\r]/.test(str)?"'"+str:str;
 return '"'+safe.replace(/"/g,'""')+'"';
}
window.hblExportSchedule=function(format){
 const slots=slotsCopy(),rows=hblScheduleRows(slots);
 let content,name,type;
 if(format==='csv'){
  const header=['Tag','Block','Woche','Fach','Klasse','Raum'];
  const lines=[header,...rows.map(r=>[WORKDAYS[r.day],r.block,r.week,r.subject,r.group,r.room])];
  content='\uFEFF'+lines.map(r=>r.map(hblScheduleCsvCell).join(';')).join('\r\n');
  name='HBL-Stundenplan.csv';type='text/csv;charset=utf-8';
 }else{
  content=JSON.stringify({format:'hbl-stundenplan',version:2,exportedAt:new Date().toISOString(),slots,duties:prepDone.__dutiesV1?.slots||{}},null,2);
  name='HBL-Stundenplan.json';type='application/json';
 }
 const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),30000);
};
function hblCsvParse(text){
 const src=String(text).replace(/^\uFEFF/,'');const first=(src.split(/\r?\n/,1)[0]||'');
 const delim=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';
 const records=[];let row=[],cell='',quoted=false;
 for(let i=0;i<src.length;i++){
  const c=src[i];
  if(quoted){if(c==='"'&&src[i+1]==='"'){cell+='"';i++;}else if(c==='"')quoted=false;else cell+=c;}
  else if(c==='"')quoted=true;
  else if(c===delim){row.push(cell);cell='';}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&src[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))records.push(row);row=[];cell='';}
  else cell+=c;
 }
 if(quoted)throw Error('Nicht geschlossene Anführungszeichen in CSV.');
 row.push(cell);if(row.some(v=>v.trim()))records.push(row);
 return records;
}
function hblDayNumber(v){
 const x=lower(v);
 const map={mo:1,montag:1,di:2,dienstag:2,mi:3,mittwoch:3,do:4,donnerstag:4,fr:5,freitag:5};
 return map[x]||Number(x);
}
function hblParseScheduleFile(filename,contents){
 let slots={},duties=null;
 if(/\.json$/i.test(filename)){
  const data=JSON.parse(contents);
  if(data?.format&&data.format!=='hbl-stundenplan')throw Error('Dies ist keine HBL-Stundenplan-Datei.');
  if(data?.version&&![1,2].includes(data.version))throw Error('Unbekannte Stundenplan-Version.');
  if(data?.duties&&typeof data.duties==='object'&&!Array.isArray(data.duties)){
   duties={};
   for(const [key,entry] of Object.entries(data.duties)){
    if(!/^([1-5])-(breakfast|lunch1|lunch2)$/.test(key)||!entry||typeof entry!=='object')throw Error('Ungültige Aufsicht: '+key);
    const item={};
    for(const w of ['A','B'])if(entry[w]!=null){
     const place=String(entry[w]?.place||'').trim();
     if(!place||place.length>60)throw Error('Ungültiger Aufsichtsort bei '+key+' / '+w);
     item[w]={place};
    }
    if(item.A||item.B)duties[key]=item;
   }
  }
  const raw=data?.slots||data?.__timetableV1?.slots;
  if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('Keine gültigen Stundenplan-Blöcke gefunden.');
  for(const [key,slot] of Object.entries(raw)){
   const match=/^([1-5])-([1-4])$/.exec(key);
   if(!match)throw Error('Ungültiger Block: '+key);
   if(!slot||typeof slot!=='object')throw Error('Ungültige Belegung: '+key);
   const pair={};
   for(const w of ['A','B'])if(slot[w]!=null){
    const v=normalizedEntry(slot[w]);
    if(!v)throw Error('Fach oder Klasse fehlt bei '+key+' / '+w);
    pair[w]=v;
   }
   if(pair.A||pair.B)slots[key]=pair;
  }
 }else if(/\.csv$/i.test(filename)){
  const rows=hblCsvParse(contents);
  if(rows.length<2)throw Error('Die CSV enthält keine Stundenplan-Einträge.');
  const norm=x=>lower(x).replace(/[^a-z0-9äöüß]/g,'');
  const heads=rows[0].map(norm);
  const col=(...names)=>heads.findIndex(h=>names.includes(h));
  const ix={day:col('tag','wochentag','day'),block:col('block','unterrichtsblock','stunde'),week:col('woche','ab','abwoche','week'),subject:col('fach','subject'),group:col('klasse','kurs','klassekurs','group'),room:col('raum','room')};
  if(['day','block','week','subject','group'].some(k=>ix[k]<0))throw Error('CSV-Spalten benötigt: Tag; Block; Woche; Fach; Klasse; Raum.');
  for(let i=1;i<rows.length;i++){
   const row=rows[i],day=hblDayNumber(row[ix.day]),block=Number(row[ix.block]),week=String(row[ix.week]||'').trim().toUpperCase().replace(/\s/g,'');
   const v=normalizedEntry({subject:row[ix.subject],group:row[ix.group],room:ix.room<0?'':row[ix.room]});
   if(!Number.isInteger(day)||day<1||day>5||!Number.isInteger(block)||block<1||block>4||!v)throw Error('Ungültiger Eintrag in CSV-Zeile '+(i+1));
   if(!['A','B','A+B','AB','BEIDE'].includes(week))throw Error('Woche muss A, B oder A+B sein (Zeile '+(i+1)+').');
   const key=day+'-'+block,pair=slots[key]||{};
   const weeks=['A+B','AB','BEIDE'].includes(week)?['A','B']:[week];
   for(const w of weeks){
    if(pair[w]&&JSON.stringify(pair[w])!==JSON.stringify(v))throw Error('Doppelte widersprüchliche Belegung in Zeile '+(i+1));
    pair[w]=v;
   }
   slots[key]=pair;
  }
 }else throw Error('Bitte eine JSON- oder CSV-Datei auswählen.');
 if(!hblScheduleRows(slots).length)throw Error('Die Datei enthält keinen belegten Unterrichtsblock.');
 return {slots,duties};
}
window.hblImportScheduleFile=async function(input){
 const file=input.files?.[0];input.value='';if(!file)return;
 if(file.size>2000000){alert('Die Datei ist zu groß (maximal 2 MB).');return;}
 try{
  const imported=hblParseScheduleFile(file.name,await file.text()),slots=imported.slots;
  const rows=hblScheduleRows(slots);
  const unique=new Set(rows.map(r=>lower(r.subject)+'|'+lower(r.group))).size;
  const existing=hblScheduleRows(slotsCopy()).length;
  const example=rows.slice(0,6).map(r=>WORKDAYS[r.day]+' '+r.block+'. Block · '+r.week+' · '+r.subject+' '+r.group).join('\n');
  const message='Import-Vorschau: '+file.name+'\n\n'+rows.length+' Wochenbelegungen in '+Object.keys(slots).length+' Blöcken\n'+unique+' verschiedene Kurse\n\n'+example+(rows.length>6?'\n…':'')+'\n\nACHTUNG: Der bisherige Stundenplan ('+existing+' Wochenbelegungen) wird ersetzt. Bereits gespeicherte Bewertungen bleiben erhalten.\n\nJetzt importieren?';
  if(!confirm(message))return;
  const previous=prepDone.__dutiesV1;
  if(imported.duties!==null)prepDone.__dutiesV1={version:1,slots:imported.duties};
  if(await persistSchedule(slots)){hblOpenPlanManager(true);alert('Stundenplan importiert'+(imported.duties!==null?' – Aufsichten übernommen.':'.'));}
  else {prepDone.__dutiesV1=previous;renderTimetable();renderToday();}
 }catch(e){alert('Import nicht möglich: '+e.message);}
};

window.hblClearTimetable=async function(){
 if(!confirm('Alle Stundenplan-Belegungen löschen? Bereits erfasste Bewertungen bleiben in ihren Kursen erhalten; nicht bewertete automatische Termine werden entfernt.'))return;

 const host=document.querySelector('.timetablecard');if(!host)return;
 let panel=byId('hblPlanManager');
 if(!panel){
  panel=document.createElement('div');panel.id='hblPlanManager';panel.className='hbl-plan-manager';panel.hidden=true;
  panel.innerHTML=`<div><strong>Deinen Stundenplan gestalten</strong><p>Klicke auf einen der 20 Blöcke oder auf eine der drei Aufsichtszeiten. Wähle bei Unterricht einen eigenen Kurs und den Raum; bei Aufsichten den frei wählbaren Aufsichtsort. Wähle A, B oder beide Wochen. Unterschiedliche Wochen werden in zwei farbigen Hälften dargestellt. Die Mitarbeitstermine entstehen automatisch – je Unterrichtsblock ein Termin.</p><small>Schuljahr 2026/27 nach Brandenburg-Kalender. Ferien/Feiertage werden ausgelassen. Bereits bewertete Termine gehen beim Umplanen nicht verloren.</small></div>
   <div class="hbl-plan-manager-actions"><button type="button" onclick="hblOpenCourseManager()">Meine Kurse</button><button type="button" onclick="hblImportSamplePlan()">Bisherigen HBL-Plan übernehmen</button><button type="button" onclick="document.getElementById('hblScheduleFile').click()">📥 Stundenplan importieren</button><input id="hblScheduleFile" type="file" accept=".json,.csv,application/json,text/csv" hidden onchange="hblImportScheduleFile(this)"><button type="button" onclick="hblExportSchedule('json')">📤 Export JSON inkl. Aufsichten</button><button type="button" onclick="hblExportSchedule('csv')">📤 Export CSV</button><button type="button" onclick="hblClearTimetable()">Stundenplan leeren</button></div>`;
  host.appendChild(panel);
 }
 managerOpen=typeof force==='boolean'?force:!managerOpen;window.hblTimetableEditing=managerOpen;panel.hidden=!managerOpen;renderTimetable();
};

 window.hblScheduleAfterLoad();
 if(byId('dashboardBoard'))renderTimetable();

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
