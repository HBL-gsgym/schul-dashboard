<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schul-Dashboard HBL · v5.10.5</title>
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --panel2:#eef2f5; --text:#18202a; --muted:#697582;
  --line:#dbe2e8; --accent:#2f6fed; --accent2:#244fa8; --shadow:0 10px 30px rgba(16,24,40,.08);
  --blueweek:#2d72d9; --greenweek:#2e9b62;
}
body.dark{
  --bg:#11151a; --panel:#191f26; --panel2:#222a33; --text:#eef3f8; --muted:#9aa6b2;
  --line:#2e3843; --accent:#79a8ff; --accent2:#a8c4ff; --shadow:0 10px 30px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
a{text-decoration:none;color:inherit}
.wrapper{max-width:1380px;margin:0 auto;padding:28px}
header{display:flex;gap:18px;align-items:stretch;margin-bottom:24px}
.hero{flex:1;background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:22px;padding:26px 30px;box-shadow:var(--shadow)}
.hero h1{margin:0 0 8px;font-size:34px;letter-spacing:-.8px}
.hero p{margin:0;color:var(--muted);font-size:16px}
.clockbox{width:300px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px 22px;box-shadow:var(--shadow)}
.clocktop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.weekbadge{display:inline-flex;align-items:center;font-size:13px;font-weight:700;color:white;padding:7px 12px;border-radius:999px}
.weekletter{font-size:24px;font-weight:900;line-height:1;padding-right:10px;margin-right:10px;border-right:1px solid rgba(255,255,255,.45)}
.weektext{white-space:nowrap}
.cyclemark{font-size:28px;font-weight:900;line-height:1;color:var(--text);margin-left:10px}
.weekleft{display:flex;align-items:center}
.weekbadge.blue{background:var(--blueweek)}
.weekbadge.green{background:var(--greenweek)}
.time{font-size:34px;font-weight:750;letter-spacing:.5px}
.date{color:var(--muted);margin-top:4px}
.kw{font-weight:650;margin-top:8px}
.theme{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:7px 10px;cursor:pointer}
.searchbar{display:flex;gap:10px;margin-bottom:24px}
.searchbar input{flex:1;padding:15px 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);font-size:16px;outline:none}
.searchbar button{padding:0 22px;border:0;border-radius:14px;background:var(--accent);color:white;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(390px,3fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.card h2{font-size:18px;margin:0}.card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;cursor:pointer}.card-title:hover{color:var(--accent)}.openall{font-size:12px;color:var(--muted);font-weight:650}
.links{display:grid;grid-template-columns:1fr;gap:9px}
.btn{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:650;transition:.15s}
.btn:hover{transform:translateY(-1px);border-color:var(--accent);box-shadow:0 5px 14px rgba(0,0,0,.06)}
.icon{font-size:18px;width:22px;text-align:center}
.subjects{margin-top:24px}
.subject-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.subject{padding:16px;border-radius:15px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:750;display:flex;justify-content:space-between;align-items:center}
.subject small{color:var(--muted);font-weight:500}
.folders{margin-top:18px}
.folder-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.placeholder{opacity:.62;border-style:dashed}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}
.section-title h2{margin:0}
.back{display:inline-block;margin-bottom:18px;color:var(--accent);font-weight:700}
.subject-page{max-width:1100px;margin:0 auto;padding:32px}
.subject-head{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow);margin-bottom:20px}
.subject-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mini-note{color:var(--muted);font-size:14px}
@media (max-width:1150px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.timetablecard{grid-column:1/-1}}
@media (max-width:950px){
  header{flex-direction:column}.clockbox{width:100%}.grid{grid-template-columns:1fr}.subject-row{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:600px){
  .wrapper{padding:16px}.hero h1{font-size:28px}.subject-row,.folder-row,.subject-grid{grid-template-columns:1fr}.links{grid-template-columns:1fr}
}
.todaybox{margin-bottom:24px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.todayhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.todayhead h2{margin:0;font-size:18px}.todaymeta{color:var(--muted);font-size:13px;font-weight:650}
.lessonrow{display:grid;grid-template-columns:115px 1fr 90px;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-top:8px}
.lessonrow.current{border-color:var(--accent)}.lessontime,.lessonmain{font-weight:750}.lessondetail,.lessonroom{color:var(--muted);font-size:13px}.lessonroom{text-align:right}.nolesson{color:var(--muted);padding:6px 2px}
.todaymeta:empty{display:none}
.timetablecard{min-width:0}.timetablegrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.dayhead{font-size:12px;text-align:center;font-weight:750;padding:7px 0}.blockcell{min-height:79px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);padding:7px 6px;font-size:11px}.blockcell.shared{background:#e5e8ec;color:#26313d}.blockcell.green{background:#d7f2e2;border-color:#71c69a;color:#164a31}.blockcell.blue{background:#dceaff;border-color:#83acef;color:#173d77}.blockcell.mixed{border-color:var(--accent)}.blockcell.off{opacity:.35}.blocknum{font-weight:800;margin-bottom:4px}.blockentry{font-weight:650;line-height:1.35}.blockentry+.blockentry{margin-top:4px;border-top:1px solid currentColor;padding-top:4px}.timetablelegend{font-size:11px;color:var(--muted);margin-top:10px}@media(max-width:700px){.timetablegrid{overflow-x:auto;grid-template-columns:repeat(5,minmax(95px,1fr))}}
.linkwithcopy{display:flex;align-items:stretch;gap:4px;min-width:0}.linkwithcopy>a{flex:1;min-width:0}.copyuser{border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);font-size:19px;cursor:pointer;min-width:32px;padding:0 5px}.copyuser:hover{filter:brightness(.95)}

.planninggrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:stretch;margin-bottom:8px}
.planningpanel{min-width:0;margin-bottom:0;padding:16px;overflow:hidden}
.planningpanel .todayhead{flex-wrap:wrap;gap:6px}
.planningpanel .todayhead h2{font-size:17px}
.planningpanel .lessonrow{grid-template-columns:105px minmax(0,1fr);gap:8px;padding:9px;margin-top:7px}
.planningpanel .lessonmain{overflow-wrap:anywhere}
.prepweeklabel{font-size:12px;font-weight:800;padding:5px 9px;border-radius:9px;white-space:nowrap}
.prepweeklabel.green{background:#d7f2e2;color:#155c38}.prepweeklabel.blue{background:#dceaff;color:#174d95}
.prepday{display:grid;grid-template-columns:29px minmax(0,1fr);gap:7px;margin-top:8px;align-items:start}
.prepdayname{font-size:12px;font-weight:850;color:var(--muted);padding-top:9px}
.prepdayitems{display:grid;gap:5px}
.prepitem{display:flex;align-items:center;gap:7px;border-radius:9px;padding:7px 8px;font-size:12px;line-height:1.3;cursor:pointer;min-width:0}
.prepitem.prepA{background:#d7f2e2;color:#164a31;border:1px solid #9fd8b8}
.prepitem.prepB{background:#dceaff;color:#173d77;border:1px solid #a9c7f4}
.prepitem input{width:16px;height:16px;flex-shrink:0;accent-color:#2563eb;cursor:pointer}
.prepnum{font-weight:800;flex-shrink:0}
.preptitle{overflow-wrap:anywhere;font-weight:650}
.prepitem.isdone .preptitle{text-decoration:line-through;opacity:.62}
.preptools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 22px 0;color:var(--muted);font-size:11px}
.prepactions{display:flex;gap:7px;flex-shrink:0}
.prepactions button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 10px;font-size:11px;font-weight:750;cursor:pointer}
@media(max-width:800px){.planninggrid{grid-template-columns:1fr 1fr}.planninggrid>.planningpanel:first-child{grid-column:auto}}
@media(max-width:650px){.planninggrid{grid-template-columns:1fr}.planninggrid>.planningpanel:first-child{grid-column:auto}.preptools{align-items:flex-start;flex-direction:column}}

.tasksarea{margin-top:16px;border-top:1px solid var(--line);padding-top:13px}
.taskhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.taskhead h3{font-size:15px;margin:0}.taskadd{border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);padding:6px 9px;font-weight:750;cursor:pointer;font-size:12px}
.taskentry{display:flex;gap:9px;align-items:flex-start;padding:9px;margin-bottom:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:12px}
.taskentry.overdue{border-color:#d97706}.taskentry.soon{border-color:#eab308}
.taskentry input[type=checkbox]{width:17px;height:17px;flex-shrink:0;cursor:pointer;accent-color:#16835b}
.taskcontent{min-width:0;flex:1}.tasktitle{font-weight:750;overflow-wrap:anywhere}
.taskdeadline{font-size:11px;color:var(--muted);margin-top:3px}.taskentry.overdue .taskdeadline{color:#c2410c;font-weight:750}
.taskempty{font-size:12px;color:var(--muted);padding:7px 0}
.taskform{display:grid;gap:10px;margin-top:10px;padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.taskform[hidden],.taskform label[hidden]{display:none!important}
.taskform label{font-size:12px;font-weight:700;display:grid;gap:4px}
.taskform input,.taskform select{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:9px;font-size:13px}
.taskformactions{display:flex;gap:8px}.taskformactions button{border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;background:var(--panel);color:var(--text)}
.taskformactions button:first-child{background:#2563eb;color:white;border-color:#2563eb}
.versionhint{font-size:10px;color:var(--muted);font-weight:600}.taskadd{background:#2563eb;color:#fff;border-color:#2563eb;font-size:13px;padding:9px 12px}

/* HBL: selbstenthaltene Hintergrundmotive und klar abgesetzter Nachtmodus */
body{position:relative;min-height:100vh;isolation:isolate}
.dashboard-scene{position:fixed;inset:0;z-index:-1;pointer-events:none;background-position:center top;background-size:cover;background-repeat:no-repeat;opacity:.48;transition:background-image .3s,opacity .3s}
body.dark .dashboard-scene{opacity:.28}
.wrapper,.subject-page{position:relative;z-index:1}
.hero{position:relative;overflow:hidden}
.hero-content{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;min-height:74px}
.hero-intro{min-width:250px}
.background-controls{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0}
.background-caption{color:var(--muted);font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:800}
.background-options{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.bg-option{border:1px solid var(--line);color:var(--muted);background:var(--panel);border-radius:999px;padding:8px 10px;font-size:11px;font-weight:750;cursor:pointer;transition:.15s}
.bg-option:hover{border-color:var(--accent);color:var(--text)}
.bg-option.selected{border-color:var(--accent);color:var(--accent2);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--accent)}
body[data-backdrop="astro"] .hero{background:radial-gradient(ellipse at 85% 25%,rgba(141,129,232,.22),transparent 65%),linear-gradient(135deg,var(--panel),var(--panel2))}
body[data-backdrop="math"] .hero{background:radial-gradient(ellipse at 85% 25%,rgba(95,185,144,.19),transparent 65%),linear-gradient(135deg,var(--panel),var(--panel2))}
body[data-backdrop="physics"] .hero{background:radial-gradient(ellipse at 85% 25%,rgba(64,147,218,.18),transparent 65%),linear-gradient(135deg,var(--panel),var(--panel2))}
.clocktop{gap:10px;min-width:0;flex-wrap:nowrap}
.weekbadge{min-width:0;flex-shrink:1}.weektext{overflow:hidden;text-overflow:ellipsis}
.clockbox .theme{flex:none;min-width:36px;min-height:36px;border-radius:11px;font-size:18px;display:grid;place-items:center}
.versionhint{display:none}
/* Editor: Korrekturen und Aufgaben zusammen in Spalte 2 */
.taskgroupheading{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px;margin:13px 0 7px}
.taskgroupheading.moretasks{padding-top:12px;border-top:1px solid var(--line)}
.taskcounter{display:inline-flex;justify-content:center;align-items:center;min-width:21px;height:20px;padding:0 5px;border-radius:7px;background:var(--panel2);font-size:11px;color:var(--muted);font-weight:800}
.taskpanel .taskentry{align-items:center;gap:7px;margin:0 0 6px;padding:8px 9px}
.taskpanel .tasktitle{line-height:1.35}
.taskedit{border:1px solid transparent;color:var(--muted);background:transparent;border-radius:7px;font-size:18px;cursor:pointer;line-height:1;padding:4px 5px}
.taskedit:hover,.taskrestore:hover{color:var(--accent);background:var(--panel)}
.formheadline{font-size:13px;font-weight:850;color:var(--text);margin-bottom:2px}
.taskcompleted{margin-top:18px;padding-top:13px;border-top:1px solid var(--line)}
.taskcompletedhead{display:flex;align-items:center;justify-content:space-between;gap:6px}
.taskcompletedhead h3{font-size:12px;margin:0;color:var(--muted)}
.taskdoneitem{display:flex;align-items:center;gap:6px;padding:5px 2px;border-bottom:1px dotted var(--line);font-size:11px;color:var(--muted)}
.taskdonecheck{font-weight:900;color:#339870}
.taskdonelabel{overflow-wrap:anywhere;flex:1;min-width:0;text-decoration:line-through;opacity:.86}
.taskdonedate{white-space:nowrap;font-size:10px}
.taskrestore{border:0;background:transparent;color:var(--muted);border-radius:6px;cursor:pointer;font-size:16px;line-height:1;padding:2px 3px}
.oldertasks{margin-top:9px}.oldertasks[hidden]{display:none}
.oldertasks summary{cursor:pointer;font-size:11px;color:var(--muted);font-weight:700;padding:6px 0}
/* Kleines Schuljahres-Punkteraster / 'Life Calendar' */
.schoolyear-card{padding:18px 20px;margin:15px 0 16px}
.schoolyear-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.schoolyear-kicker{letter-spacing:.13em;font-size:9px;font-weight:850;color:var(--accent);margin-bottom:4px}
.schoolyear-title h2{margin:0;font-size:19px}
.schoolyear-progress{text-align:right;white-space:nowrap}.schoolyear-progress strong{display:block;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}.schoolyear-progress strong span{color:var(--muted);font-size:15px;font-weight:550}.schoolyear-progress small{color:var(--muted);font-size:11px}
.schoolyear-content{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(215px,.75fr);gap:22px;align-items:start}
.schoolyear-gridpart{min-width:0}
.schooldots-layout{display:flex;align-items:stretch;gap:9px}
.schooldots-axis{display:grid;grid-template-columns:repeat(var(--school-weeks),minmax(0,1fr));margin-left:35px;gap:3px;min-height:18px}
.schoolmonth{font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap}
.schooldots-weekdays{flex:none;display:grid;grid-template-rows:repeat(5,10px);gap:4px;font-size:9px;color:var(--muted);font-weight:800;align-items:center;width:26px}
.schooldots{flex:1;min-width:0;display:grid;grid-template-columns:repeat(var(--school-weeks),minmax(0,1fr));gap:3px}
.schoolweek{display:grid;grid-template-rows:repeat(5,10px);gap:4px;justify-items:center}
.schooldot{height:9px;width:9px;border-radius:50%;display:block;border:1.2px solid #a9b8c5;box-sizing:border-box}
.schooldot.done{background:#385877;border-color:#385877}
.schooldot.pending{background:transparent}
.schooldot.vacation{background:#dfac53;border-color:#dba950}
.schooldot.free{background:#d9958f;border-color:#d9958f}
.schooldot.empty{opacity:0}
.schooldot.is-today{outline:2px solid var(--accent);outline-offset:2px}
body.dark .schooldot.done{background:#8bb5e7;border-color:#8bb5e7}
body.dark .schooldot.pending{border-color:#64788d}
.schooldots-legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 0 0 35px;font-size:10px;color:var(--muted)}
.schooldots-legend>span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legenddot{display:inline-block;border-radius:50%;width:9px;height:9px;border:1px solid #a9b8c5}
.legenddot.done{background:#385877;border-color:#385877}.legenddot.pending{background:transparent}.legenddot.vacation{background:#dfac53;border-color:#dfac53}.legenddot.free{background:#d9958f;border-color:#d9958f}
.schoolyear-milestones{border-left:1px solid var(--line);padding-left:18px;min-height:95px}
.milestone-overline{font-weight:850;font-size:9px;letter-spacing:.12em;color:var(--muted)}
.milestone-nextname{font-size:18px;font-weight:800;margin:5px 0 2px;letter-spacing:-.03em}
.milestone-nextdate{font-size:12px;color:var(--accent);font-weight:700}
/* Countdown bis zum Beginn der nächsten Schulferien */
.school-countdown{display:flex;align-items:center;gap:12px;margin-top:14px;padding:13px 14px;border:1px solid var(--design-edge,var(--line));border-radius:14px;background:linear-gradient(120deg,var(--panel2),var(--panel));box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.school-countdown-number{font-size:35px;font-weight:850;line-height:1;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;color:var(--accent);min-width:43px;text-align:center}
.school-countdown-caption{font-size:12px;font-weight:730;line-height:1.35;color:var(--text)}
.school-countdown-caption small{display:block;margin-top:3px;font-size:10px;line-height:1.3;font-weight:500;color:var(--muted)}
body.dark .school-countdown{background:linear-gradient(115deg,var(--panel2),var(--panel));border-color:var(--line)}

.milestones-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.milestone-pill{font-size:10px;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:5px 7px;border-radius:8px;white-space:nowrap}
.milestone-pill.milestone-past{opacity:.4}.milestone-pill.milestone-current{border-color:#dfac53;background:rgba(223,172,83,.15)}
.schoolyear-note{font-size:10px;color:var(--muted);margin-top:11px;opacity:.86}
@media(max-width:1150px){.schoolyear-content{grid-template-columns:minmax(0,1.5fr) minmax(215px,.9fr)}.hero-content{align-items:flex-start}}
@media(max-width:800px){.schoolyear-content{grid-template-columns:1fr}.schoolyear-milestones{border-left:0;border-top:1px solid var(--line);padding:12px 0 0}.schooldot{height:8px;width:8px}.background-controls{align-items:flex-start}}
/* Smartphone quer: Kalender erhält die ganze Breite, Zusatzinfos folgen darunter. */
@media (orientation:landscape) and (max-height:600px) and (max-width:1100px) and (hover:none){
  .schoolyear-content{grid-template-columns:minmax(0,1fr)}
  .schoolyear-milestones{border-left:0;border-top:1px solid var(--line);padding:12px 0 0}
  .schoolyear-gridpart{min-width:0}
}

@media(max-width:540px){.schoolyear-card{padding:14px}.schooldots{gap:1px}.schooldots-axis{gap:1px}.schooldot{width:5px;height:5px;border-width:1px}.schooldots-legend{gap:8px}.hero-content{flex-direction:column}.background-options{justify-content:flex-start}}


/* ===== Design-Modi: Neutral / Astro / Mathe / Physik ===== */
body{
  --design-bg: radial-gradient(circle at top left, rgba(255,255,255,.55), rgba(255,255,255,0) 32%), linear-gradient(180deg,#eef3f8 0%, #e9eff4 100%);
  --design-card: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.82));
  --design-card-strong: linear-gradient(180deg, rgba(255,255,255,.98), rgba(244,248,252,.93));
  --design-edge: rgba(123,146,171,.20);
  --design-glow: rgba(47,111,237,.12);
  --design-title: #142132;
}
body.dark{
  --design-bg: radial-gradient(circle at top left, rgba(108,136,185,.18), rgba(0,0,0,0) 28%), linear-gradient(180deg,#11161c 0%, #0d1218 100%);
  --design-card: linear-gradient(180deg, rgba(27,34,42,.92), rgba(20,26,32,.88));
  --design-card-strong: linear-gradient(180deg, rgba(32,39,48,.95), rgba(22,28,35,.94));
  --design-edge: rgba(125,152,182,.22);
  --design-glow: rgba(121,168,255,.16);
  --design-title: #f4f8fd;
}
body{
  background: var(--design-bg) !important;
}
.dashboard-scene{
  opacity:.72;
  filter:saturate(1.15) contrast(1.02);
}
body.dark .dashboard-scene{
  opacity:.40;
  filter:saturate(1.28) brightness(.92);
}
.hero, .clockbox, .card, .todaybox, .subject, .subject-head{
  background: var(--design-card);
  backdrop-filter: blur(7px);
  border-color: var(--design-edge);
  box-shadow:
    0 12px 36px rgba(15,23,42,.08),
    0 1px 0 rgba(255,255,255,.65) inset,
    0 0 0 1px rgba(255,255,255,.08);
}
body.dark .hero, body.dark .clockbox, body.dark .card, body.dark .todaybox, body.dark .subject, body.dark .subject-head{
  box-shadow:
    0 14px 34px rgba(0,0,0,.24),
    0 1px 0 rgba(255,255,255,.04) inset,
    0 0 0 1px rgba(255,255,255,.02);
}
.hero{background:var(--design-card-strong); position:relative; overflow:hidden}
.hero::before{
  content:"";
  position:absolute; inset:auto -8% -45% auto;
  width:320px; height:320px; border-radius:50%;
  background: radial-gradient(circle, var(--design-glow), rgba(255,255,255,0) 68%);
  pointer-events:none;
}
.hero h1, .time, .schoolyear-title h2, .todayhead h2, .card h2{
  color: var(--design-title);
}
.background-controls{
  padding:10px 12px;
  border-radius:16px;
  background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.28));
  border:1px solid var(--design-edge);
}
body.dark .background-controls{
  background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
}
.background-caption{
  font-size:9px;
  letter-spacing:.18em;
}
.background-options{
  gap:7px;
}
.bg-option{
  border-radius:999px;
  padding:8px 12px;
  font-size:11px;
  font-weight:800;
  background: rgba(255,255,255,.68);
  color: var(--muted);
  border:1px solid rgba(126,145,167,.28);
}
body.dark .bg-option{
  background: rgba(255,255,255,.04);
}
.bg-option.selected{
  transform:translateY(-1px);
}
.hero p{max-width:50ch}
.weekbadge{
  box-shadow:0 8px 18px rgba(0,0,0,.08);
}
.clockbox{
  background: var(--design-card-strong);
}
.linkwithcopy .copyuser,
.theme,
.prepactions button,
.taskadd,
.taskformactions button{
  box-shadow: 0 4px 10px rgba(15,23,42,.06);
}
.taskentry, .lessonrow, .prepitem, .blockcell, .btn{
  background: linear-gradient(180deg, rgba(255,255,255,.74), rgba(246,249,252,.66));
}
body.dark .taskentry, body.dark .lessonrow, body.dark .prepitem, body.dark .blockcell, body.dark .btn{
  background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
}
.taskpanel .taskentry, .todaybox .taskentry{
  border-radius:12px;
}
.schoolyear-card{
  background: var(--design-card);
}
/* Neutral */
body[data-backdrop="none"]{
  --accent:#315fbe;
  --design-glow: rgba(48,95,190,.15);
}
/* Astro */
body[data-backdrop="astro"]{
  --accent:#6d5efc;
  --accent2:#4332c8;
  --line:#d9d8f5;
  --design-bg:
    radial-gradient(circle at 12% 16%, rgba(98,87,255,.20), rgba(0,0,0,0) 24%),
    radial-gradient(circle at 88% 22%, rgba(65,203,255,.18), rgba(0,0,0,0) 22%),
    linear-gradient(180deg,#edf0ff 0%, #e8ebfa 56%, #edf1f9 100%);
  --design-card: linear-gradient(180deg, rgba(255,255,255,.88), rgba(244,245,255,.80));
  --design-card-strong: linear-gradient(180deg, rgba(255,255,255,.97), rgba(240,241,255,.90));
  --design-edge: rgba(109,94,252,.18);
  --design-glow: rgba(109,94,252,.22);
  --design-title:#171a39;
}
body.dark[data-backdrop="astro"]{
  --design-bg:
    radial-gradient(circle at 12% 18%, rgba(115,100,255,.34), rgba(0,0,0,0) 25%),
    radial-gradient(circle at 86% 16%, rgba(58,203,255,.20), rgba(0,0,0,0) 24%),
    linear-gradient(180deg,#0f1322 0%, #12182a 58%, #0d111c 100%);
  --design-card: linear-gradient(180deg, rgba(27,30,51,.90), rgba(19,22,39,.92));
  --design-card-strong: linear-gradient(180deg, rgba(35,40,66,.96), rgba(22,26,45,.94));
  --design-edge: rgba(128,115,255,.24);
  --design-glow: rgba(124,113,255,.24);
  --design-title:#f4f5ff;
}
body[data-backdrop="astro"] .dashboard-scene{
  opacity:.88;
  filter:saturate(1.25) contrast(1.06);
}
/* Mathe */
body[data-backdrop="math"]{
  --accent:#0f9f7b;
  --accent2:#0b6b57;
  --line:#d8ece6;
  --design-bg:
    radial-gradient(circle at 13% 18%, rgba(15,159,123,.17), rgba(0,0,0,0) 24%),
    radial-gradient(circle at 84% 18%, rgba(18,112,176,.14), rgba(0,0,0,0) 20%),
    linear-gradient(180deg,#eef8f5 0%, #eaf5f4 50%, #eef6fb 100%);
  --design-card: linear-gradient(180deg, rgba(255,255,255,.90), rgba(241,250,247,.82));
  --design-card-strong: linear-gradient(180deg, rgba(255,255,255,.98), rgba(237,250,246,.92));
  --design-edge: rgba(15,159,123,.18);
  --design-glow: rgba(15,159,123,.18);
  --design-title:#14302a;
}
body.dark[data-backdrop="math"]{
  --design-bg:
    radial-gradient(circle at 14% 17%, rgba(16,181,136,.22), rgba(0,0,0,0) 23%),
    radial-gradient(circle at 83% 16%, rgba(62,159,255,.16), rgba(0,0,0,0) 22%),
    linear-gradient(180deg,#0f1d1c 0%, #102425 56%, #0f1820 100%);
  --design-card: linear-gradient(180deg, rgba(24,41,38,.92), rgba(16,31,31,.92));
  --design-card-strong: linear-gradient(180deg, rgba(28,49,44,.95), rgba(16,34,34,.94));
  --design-edge: rgba(33,174,146,.20);
  --design-glow: rgba(24,191,151,.18);
  --design-title:#eefcf9;
}
body[data-backdrop="math"] .dashboard-scene{
  opacity:.84;
  filter:saturate(1.15);
}
/* Physik */
body[data-backdrop="physics"]{
  --accent:#1f80d7;
  --accent2:#0f4aa0;
  --line:#dce7f6;
  --design-bg:
    radial-gradient(circle at 14% 18%, rgba(31,128,215,.15), rgba(0,0,0,0) 26%),
    radial-gradient(circle at 86% 20%, rgba(76,191,182,.17), rgba(0,0,0,0) 24%),
    linear-gradient(180deg,#eef5fb 0%, #ebf3fa 46%, #eff8f9 100%);
  --design-card: linear-gradient(180deg, rgba(255,255,255,.90), rgba(241,247,255,.82));
  --design-card-strong: linear-gradient(180deg, rgba(255,255,255,.98), rgba(238,247,255,.92));
  --design-edge: rgba(31,128,215,.18);
  --design-glow: rgba(76,191,182,.22);
  --design-title:#122e4e;
}
body.dark[data-backdrop="physics"]{
  --design-bg:
    radial-gradient(circle at 10% 16%, rgba(33,136,226,.25), rgba(0,0,0,0) 24%),
    radial-gradient(circle at 86% 18%, rgba(80,200,190,.18), rgba(0,0,0,0) 24%),
    linear-gradient(180deg,#0f1724 0%, #102031 54%, #101a22 100%);
  --design-card: linear-gradient(180deg, rgba(22,34,49,.92), rgba(17,27,38,.92));
  --design-card-strong: linear-gradient(180deg, rgba(28,42,60,.95), rgba(18,30,43,.94));
  --design-edge: rgba(76,149,230,.20);
  --design-glow: rgba(83,191,181,.18);
  --design-title:#f1f8ff;
}
body[data-backdrop="physics"] .dashboard-scene{
  opacity:.83;
  filter:saturate(1.18);
}


/* Windows-Verzeichnisse ueber den lokalen HBL-Server */
.folder-row{grid-template-columns:repeat(2,minmax(0,1fr))}
.folder-open{width:100%;appearance:none;font:inherit;text-align:left;color:var(--text);cursor:pointer}
.folder-open:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.folder-open:disabled{opacity:.65;cursor:progress}
.folder-open .folderpath{margin-left:auto;color:var(--muted);font-weight:600;font-size:12px}
.folder-hint{margin-top:10px;font-size:12px;color:var(--muted);min-height:17px}
.folder-hint.error{color:#b45309}
@media(max-width:600px){.folder-row{grid-template-columns:1fr}}

/* Drei direkte YouTube-Verknüpfungen im Kopfbereich */
.music-shortcuts{
  margin-top:18px;padding-top:14px;border-top:1px solid var(--design-edge);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:relative;z-index:1;
}
.music-caption{display:inline-flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.075em;text-transform:uppercase;font-weight:850;color:var(--muted);white-space:nowrap}
.music-caption-icon{font-size:18px;color:var(--accent);line-height:1}
.music-shortcut-links{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0}
.music-shortcut{
  display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:7px 11px;
  background:rgba(255,255,255,.56);border:1px solid var(--design-edge);
  border-radius:999px;color:var(--text);font-size:11px;font-weight:750;
  transition:transform .16s,border-color .16s,background .16s,box-shadow .16s;
}
body.dark .music-shortcut{background:rgba(255,255,255,.055)}
.music-shortcut:hover{transform:translateY(-2px);border-color:var(--accent);background:var(--panel);box-shadow:0 5px 18px var(--design-glow)}
.music-shortcut:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.music-shortcut>span:first-child{font-size:14px;color:var(--accent);font-weight:900}
.music-external{font-size:13px;color:var(--muted);font-weight:700}
@media(max-width:800px){.music-shortcuts{align-items:flex-start;flex-direction:column;gap:9px}.music-shortcut-links{gap:6px}}


/* ---- Kopfzeile mit Autoren-Signatur und Versionsanzeige ---- */
.hero-headline{display:flex;align-items:center;column-gap:13px;row-gap:6px;flex-wrap:wrap}
.hero-headline h1{margin-bottom:7px}
.dashboard-version{
  display:inline-flex;align-items:center;white-space:nowrap;vertical-align:middle;
  margin-bottom:7px;padding:5px 9px;border-radius:999px;
  color:var(--text);font-size:10px;line-height:1;font-weight:800;letter-spacing:.035em;
  background:var(--panel2);border:1px solid var(--design-edge);
  font-variant-numeric:tabular-nums;
}
.dashboard-version-date{color:var(--muted);font-weight:650}
.dashboard-creator{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:13px;line-height:1}
.creator-label{font-size:9px;font-weight:900;color:var(--muted);letter-spacing:.19em;text-transform:uppercase}
/* Adventure wird verwendet, wenn lokal installiert. Copperplate ist eine portable Ersatzanmutung. */
.creator-signature{
  font-family:'Adventure','Copperplate Gothic Bold','Copperplate','Book Antiqua',Georgia,serif;
  font-size:17px;font-weight:900;font-variant:small-caps;text-transform:uppercase;
  font-style:italic;letter-spacing:.08em;
  color:var(--accent2);
  text-shadow:0 1px 0 rgba(255,255,255,.38), 1px 2px 1px rgba(26,29,55,.14);
  transform:skew(-6deg);transform-origin:left center;
}
body.dark .creator-signature{
  color:#f9ca72;
  text-shadow:0 1px 0 rgba(30,20,10,.4), 0 2px 8px rgba(232,164,78,.18);
}
.preptools{margin:0 0 20px;padding:0 2px;justify-content:flex-start}
/* ---- Hoher Kontrast in allen dunklen Designs ---- */
body.dark{color-scheme:dark;--line:#47566a;--muted:#b6c6d8;--text:#f1f6ff}
body.dark[data-backdrop="none"]{--accent:#96b8ff;--accent2:#d0ddff}
body.dark[data-backdrop="astro"]{--accent:#a9a0ff;--accent2:#dbd6ff}
body.dark[data-backdrop="math"]{--accent:#63e4be;--accent2:#aaf2da}
body.dark[data-backdrop="physics"]{--accent:#81c6ff;--accent2:#c7e7ff}
body.dark .blockcell,
body.dark .blockcell.shared,
body.dark .blockcell.green,
body.dark .blockcell.blue,
body.dark .blockcell.mixed{

body.dark .blockcell.shared{color:#ecf2fa;background:rgba(144,158,183,.15);border-color:rgba(160,175,199,.45)}

body.dark .blockcell.blue{color:#d5e8ff;background:rgba(44,117,206,.22);border-color:rgba(108,171,255,.66)}
body.dark .blockcell.mixed{color:#f6f6ff;border-color:var(--accent)}
body.dark .blockcell.off{opacity:.63;color:#bccadd;background:rgba(255,255,255,.025)}
body.dark .blockcell .blocknum{color:inherit;opacity:.93}
body.dark .blockcell .blockentry{color:inherit}
body.dark .prepitem.prepA{color:#cdfbe2;background:rgba(31,136,88,.21);border-color:rgba(104,216,156,.52)}
body.dark .prepitem.prepB{color:#d4e7ff;background:rgba(46,113,203,.22);border-color:rgba(116,171,247,.55)}
body.dark .prepweeklabel.green{color:#baffd3;background:rgba(34,130,86,.30);border:1px solid rgba(81,192,132,.55)}
body.dark .prepweeklabel.blue{color:#d0e6ff;background:rgba(36,101,195,.3);border:1px solid rgba(102,158,230,.55)}
body.dark .prepitem input{accent-color:#81baff}
body.dark .lessonrow,body.dark .taskentry,body.dark .btn,
body.dark .taskform{color:var(--text);border-color:var(--line)}
body.dark .taskentry .tasktitle,body.dark .lessonmain,
body.dark .time,body.dark .kw{color:var(--text)}
body.dark .searchbar button,body.dark .taskadd,
body.dark .taskformactions button:first-child{color:#0e2233;background:#8fc6ff;border-color:#8fc6ff}
body.dark .taskadd:hover,body.dark .searchbar button:hover{background:#b4dcff}
body.dark .bg-option.selected{color:var(--accent2);background:rgba(141,164,214,.16);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
body.dark .theme,body.dark .copyuser,body.dark .folder-open,
body.dark .taskedit,body.dark .taskrestore{color:var(--text)}
body.dark .milestone-pill{border-color:var(--line);color:var(--text)}
body.dark .schoolyear-title h2,body.dark .todayhead h2,body.dark .card h2{color:var(--text)}
@media(max-width:650px){.creator-signature{font-size:15px}.dashboard-version-date{display:none}}


/* Kalenderwochen und A/B-Wochen: dezente Zeile ueber den Schuljahrspunkten */
.schoolweeklabels{
  --kw-label-height:29px;
  display:grid;
  grid-template-columns:repeat(var(--school-weeks),minmax(0,1fr));
  margin:1px 0 6px 35px;
  gap:3px;
  min-height:var(--kw-label-height);
  position:relative;
}
.schoolweeklabels::before{
  content:"KW";
  position:absolute;
  left:-35px;
  top:1px;
  font-size:8px;
  font-weight:750;
  color:var(--muted);
  opacity:.8;
}
.schoolweeklabel{
  display:flex;
  align-items:center;
  flex-direction:column;
  justify-content:flex-start;
  gap:3px;
  min-width:0;
  line-height:1;
}
.schoolweeknumber{
  font-size:8px;
  color:var(--muted);
  font-weight:650;
  font-variant-numeric:tabular-nums;
}
.schoolcycle{
  font-size:8px;
  font-weight:850;
  display:grid;
  place-items:center;
  width:13px;
  height:13px;
  border-radius:4px;
  border:1px solid transparent;
}
.schoolcycle.green{color:#21714f;background:rgba(44,159,99,.13);border-color:rgba(44,159,99,.23)}
.schoolcycle.blue{color:#205ba9;background:rgba(45,114,217,.13);border-color:rgba(45,114,217,.23)}
body.dark .schoolcycle.green{color:#8bdfab;background:rgba(47,171,104,.18);border-color:rgba(86,204,130,.24)}
body.dark .schoolcycle.blue{color:#9ac4ff;background:rgba(48,121,230,.19);border-color:rgba(105,165,247,.28)}
.schoolweeklabel.current .schoolweeknumber{color:var(--text);font-weight:950}
.schoolweeklabel.current .schoolcycle{outline:1px solid currentColor;outline-offset:1px}
@media (max-width:700px){
 .schoolweeklabels{gap:1px}
 .schoolweeknumber{font-size:7px}
 .schoolcycle{width:10px;height:11px;font-size:6px;border-radius:3px}
}


/* Abenteuer-Filmlogo: selbst enthaltene Vektor-Buchstaben, keine Schriftdatei oder Internet-Verbindung nötig */
.dashboard-creator{align-items:flex-start;gap:9px;margin-top:14px}
.creator-label{padding-top:16px;white-space:nowrap;letter-spacing:.15em}
.creator-signature{
  display:block;
  width:min(390px,100%);
  max-width:390px;
  padding:0;
  color:inherit;
  transform:none;
  text-shadow:none;
  line-height:1;
  flex-shrink:1;
}
.creator-logo{
  display:block;
  width:100%;

  max-height:68px;

body.dark .creator-signature{color:inherit;text-shadow:none}
@media(max-width:780px){
 .creator-label{padding-top:10px}
 .creator-signature{max-width:320px}

/* === HBL 2.4: Wissenschafts-Edition mit illustrierten Panorama-Bannern === */
header{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(265px,305px);
  gap:12px;
  align-items:stretch;
  margin-bottom:18px;
}
header .hero{
  grid-column:1/-1;
  width:100%; min-width:0;
  padding:0;
  display:flex;
  flex-direction:column;
  border-radius:19px;
  overflow:hidden;
  border:1px solid var(--design-edge);
  background:var(--panel) !important;
  box-shadow:0 18px 45px rgba(12,20,45,.14);
}
header .hero::before{display:none}
header .hero-content{
  order:0;
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;
  min-height:134px;
  padding:18px 24px;
  background:var(--panel);
  border-bottom:1px solid var(--design-edge);

  z-index:1;

header .hero-intro{min-width:260px;flex:1}
header .hero-headline{gap:9px}
header .hero h1{font-size:31px;letter-spacing:-.9px;margin-bottom:1px}
header .hero p{font-size:12px;margin:1px 0 0;color:var(--muted)}
header .dashboard-creator{margin-top:7px;align-items:center;gap:8px}
header .creator-label{padding-top:4px;flex-shrink:0;font-size:9px}
header .creator-signature{max-width:246px}
header .creator-logo{max-height:48px}
header .background-controls{padding:11px 13px;background:var(--panel2);border-radius:13px}
header .background-caption{font-size:9px;letter-spacing:.14em}
header .bg-option{font-size:11px;padding:7px 11px}
header .banner-art{

  display:block;

  background-color:#0b1528;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  position:relative;
  isolation:isolate;
  transition:background-image .28s ease, filter .28s ease;
}
header .banner-art::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(3,8,24,.05) 0%,transparent 42%,rgba(3,8,24,.52) 100%),linear-gradient(90deg,rgba(3,8,24,.12),transparent 20%,transparent 80%,rgba(3,8,24,.12));

}
.banner-eyebrow,.banner-index{
  position:absolute;
  z-index:1;
  bottom:14px;
  color:#f8edd8;
  letter-spacing:.21em;
  text-transform:uppercase;
  font-size:10px;
  font-weight:900;
  text-shadow:0 2px 8px rgba(0,0,0,.85);

.banner-eyebrow{left:23px}
.banner-index{right:22px;color:#ded5c4;font-size:9px;letter-spacing:.18em}
header>.music-shortcuts{
  grid-column:1;grid-row:2;
  margin:0;
  padding:15px 20px;
  border:1px solid var(--design-edge);
  background:var(--panel);
  box-shadow:var(--shadow);
  border-radius:15px;
  display:flex;
  align-items:center;
  align-content:center;
  gap:12px;
  min-width:0;

  grid-column:2;grid-row:2;
  width:auto;
  margin:0;
  min-width:0;
  padding:14px 18px;
  border-radius:15px;
}
header .clocktop{margin-bottom:7px}
header .time{font-size:28px}
header .date{font-size:12px}
header .kw{font-size:12px;margin-top:5px}
header .music-shortcut{font-size:11px;padding:7px 11px}
header .music-caption{font-size:10px;letter-spacing:.10em}
.dashboard-scene{opacity:.10!important;filter:blur(2px) saturate(.7)!important}
body.dark .dashboard-scene{opacity:.08!important}
/* Museumshaftes Design: Materialien und Fachakzente auf der ganzen Seite */
body{
  --hbl-highlight:#9b7e4f;

/* ====== Mitarbeit 2.8: klassenbezogene Dokumentation ====== */
.participation-overview{margin:30px 0 34px}
.participation-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.participation-course-link{position:relative;display:flex;flex-direction:column;gap:10px;justify-content:space-between;min-width:0;padding:17px 16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);transition:transform .15s,border .15s,box-shadow .15s}
.participation-course-link:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 14px 25px rgba(0,0,0,.14)}
.participation-course-link .pcourse-top{display:flex;justify-content:space-between;align-items:center;gap:7px}
.participation-course-link .pcourse-top strong{font-size:16px;line-height:1.15;letter-spacing:-.2px}
.participation-course-link .pcourse-icon{font-size:22px}
.participation-course-link .pcourse-info{font-size:12px;color:var(--muted);font-weight:650}
.participation-course-link .pcourse-action{font-size:11px;color:var(--accent);font-weight:800}
.pcourse-action::after{content:"";position:absolute;inset:0;border-radius:16px}
.pcourse-note{position:relative;z-index:1;text-align:left;overflow-wrap:anywhere;white-space:normal;line-height:1.4;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;cursor:pointer;font:inherit;font-size:12px}
.pcourse-note-dialog{box-sizing:border-box;width:min(26rem,calc(100% - 2rem));max-height:85vh;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text)}
.pcourse-note-dialog::backdrop{background:rgba(0,0,0,.45)}
.pcourse-note-dialog h2{margin:0 0 12px}
.pcourse-note-dialog input{box-sizing:border-box;width:100%;margin:6px 0 12px;padding:9px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;font:inherit}
.pcourse-note-dialog [role=status]:empty{display:none}
.participation-course-link[data-subject="math"]{border-top:3px solid #14a37e}
.participation-course-link[data-subject="physics"]{border-top:3px solid #467aca}
.participation-course-link[data-subject="astro"]{border-top:3px solid #8574cc}
.participation-course-link[data-subject="wat"]{border-top:3px solid #c78a40}

.part-shell{max-width:1500px;margin:0 auto;padding:28px 28px 64px;position:relative;z-index:1}
.part-nav{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.part-back{color:var(--text);background:var(--panel);padding:9px 14px;border-radius:11px;box-shadow:var(--shadow);border:1px solid var(--line);font-size:13px;font-weight:800}
.part-top-meta{color:var(--muted);font-size:12px;font-weight:750}
.part-hero{display:block;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:25px 30px;margin-bottom:18px}
.part-eyebrow{letter-spacing:.18em;font-weight:850;font-size:11px;color:var(--accent);text-transform:uppercase;margin-bottom:7px}
.part-hero-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.part-hero h1{font-size:31px;line-height:1.2;margin:0}

.part-hero p{margin:8px 0 0;color:var(--muted);font-size:13px}
.part-legend{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}

.part-key b{font-size:13px;font-variant-numeric:tabular-nums}
.part-key .pk-pp{color:#16855a}.part-key .pk-p{color:#38936b}.part-key .pk-n{color:var(--muted)}.part-key .pk-m{color:#d19a3e}.part-key .pk-mm{color:#cc6257}
.part-tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:thin;padding:2px 1px 10px;margin:0 0 12px}

.part-date-group{display:grid;gap:3px;font-size:10px;font-weight:850;color:var(--muted)}

.part-table th,.part-table td{padding:9px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle;background:var(--panel)}

function isoWeek(date){
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  const dayNum=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-dayNum);
  const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-yearStart)/86400000)+1)/7);
}
function weekInfo(date){
  const kw=isoWeek(date);
  // KW 35/2026 ist A. Die Folge bleibt auch an Jahreswechseln
  // (einschliesslich einer KW 53) wirklich abwechselnd.
  const dayUTC=Date.UTC(date.getFullYear(),date.getMonth(),date.getDate());
  const dayOfWeek=new Date(dayUTC).getUTCDay();
  const mondayUTC=dayUTC-((dayOfWeek+6)%7)*86400000;
  const anchorMondayUTC=Date.UTC(2026,7,24); // Montag der KW 35/2026
  const weeksSinceAnchor=Math.round((mondayUTC-anchorMondayUTC)/604800000);
  const green=((weeksSinceAnchor%2)+2)%2===0;
  return {kw, color:green?"green":"blue", label:green?"Grüne Woche":"Blaue Woche"};
}
function updateClock(){
  const now=new Date();
  const info=weekInfo(now);
  const t=now.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const d=now.toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});
  document.getElementById("time").textContent=t;
  document.getElementById("date").textContent=d;
  document.getElementById("kw").textContent="Kalenderwoche "+info.kw;
  const badge=document.getElementById("weekbadge");
  badge.className="weekbadge "+info.color;
  document.getElementById("weekletter").textContent=info.color==="green"?"A":"B";
  document.getElementById("weektext").textContent=info.label;
}

const HBL_PAGE_IMAGES={}; // Große eingebettete Hintergrundbilder entfernt
const SCENE_NAMES=["none","astro","math","physics"];
function setBackdrop(scene,save=true){
 if(!SCENE_NAMES.includes(scene))scene="none";
 const target=document.getElementById("dashboardScene");
 if(target){
  const img=HBL_PAGE_IMAGES[scene];
  target.style.backgroundImage=img?`url("${img}")`:"none";
  target.style.opacity=img?"1":"0";
 }
 document.body.dataset.backdrop=scene;
 document.querySelectorAll(".bg-option").forEach(b=>{
  const active=b.dataset.scene===scene;
  b.classList.toggle("selected",active);
  b.setAttribute("aria-pressed",String(active));
 });
 try{localStorage.setItem("schoolBackdrop",scene)}catch(e){}
 if(save&&serverReady){prepDone.__uiBackground=scene;savePrepFile().catch(()=>{});}
}
function restoreDashboardSettings(data){
 if(typeof data.__uiDark==="boolean")applyDarkMode(data.__uiDark);
 if(SCENE_NAMES.includes(data.__uiBackground))setBackdrop(data.__uiBackground,false);
}

function currentSchoolYear(date){
 const d=taskDateString(date);
 if(d<SCHOOL_YEARS[0].start)return SCHOOL_YEARS[0];
 for(let i=SCHOOL_YEARS.length-1;i>=0;i--){if(d>=SCHOOL_YEARS[i].start)return SCHOOL_YEARS[i];}
 return SCHOOL_YEARS[0];
}
function schoolDateDescription(key,year,holidays){
 for(const v of year.vacations)if(key>=v.start&&key<=v.end)return {kind:"vacation",label:v.name};
 const varDay=year.variable.find(v=>v.date===key);
 if(varDay)return {kind:"free",label:varDay.name};
 if(holidays.has(key))return {kind:"free",label:holidays.get(key)};
 return {kind:"school",label:"Schultag"};
}
function renderSchoolCalendar(){

 const percent=total?Math.round(completed/total*100):0;

/* HBL v3.1: Kacheln frei anordnen und ein-/ausklappen.
 * Die Einstellungen liegen zusammen mit allen anderen Daten in der JSON-Datei.
 * Die Klassen-/Kursansichten werden bewusst nicht verändert.

const HBL_TILE_SPECS=[
 {id:"unterricht",selector:".planninggrid > .planningpanel:nth-child(1)",title:"Heute & Ausblick",span:3},
 {id:"aufgaben",selector:".planninggrid > .planningpanel:nth-child(2)",title:"Korrekturen & Aufgaben",span:3},
 {id:"vorbereitung-diese",selector:".planninggrid > .planningpanel:nth-child(3)",title:"Vorbereitung – diese Woche",span:3},
 {id:"vorbereitung-naechste",selector:".planninggrid > .planningpanel:nth-child(4)",title:"Vorbereitung – nächste Woche",span:3},
 {id:"kalender",selector:".schoolyear-card",title:"Schuljahreskalender",span:12},
 {id:"links",core:true,selector:"main.grid > .hbl-links-card",title:"Meine Links",span:6},
 {id:"stundenplan",core:true,selector:"main.grid > .timetablecard",title:"Wochenstundenplan",span:6},
 {id:"faecher",selector:"section.subjects",title:"Fächer",span:12},
 {id:"mitarbeit",core:true,selector:"section.participation-overview",title:"Kurse",span:12}
];
const HBL_TILE_WIDTHS=[2,3,4,6,12];
let hblDraggedTile=null;
const hblAppDisplay=matchMedia("(display-mode: standalone)");
function hblLayoutProfile(){return hblAppDisplay.matches||navigator.standalone===true?"app":"desktop";}
hblAppDisplay.addEventListener("change",()=>restoreDashboardTileLayout(prepDone));
function hblTileById(id){
 const board=document.getElementById("dashboardBoard");
 return board?[...board.children].find(el=>el.dataset.tile===id):null;
}
function hblTileStore(){
 const board=document.getElementById("dashboardBoard");
 if(!board)return null;
 const nodes=[...board.children].filter(el=>el.dataset.tile);
 const collapsed={},widths={};
 for(const n of nodes){
  if(n.classList.contains("tile-collapsed"))collapsed[n.dataset.tile]=true;
  widths[n.dataset.tile]=Number(n.dataset.tileWidth)||3;
 }
 return {order:nodes.map(n=>n.dataset.tile),collapsed,widths,hidden:nodes.filter(n=>n.hidden).map(n=>n.dataset.tile)};
}
function hblPersistTileLayout(){
 const layout=hblTileStore();if(!layout)return;
 if(!serverReady){
  prepStatus("Ansicht geändert, aber nicht gespeichert: TESTVERSION · Browser-Speicherung aktiv.",true);
  return;
 }
 prepDone.__dashboardLayoutsV2={...prepDone.__dashboardLayoutsV2,[hblLayoutProfile()]:layout};
 savePrepFile().catch(()=>{});
}
function hblSetTileFold(el,collapsed,persist=false){
 el.classList.toggle("tile-collapsed",!!collapsed);
 const button=el.querySelector(".tile-fold");
 if(button){
  button.textContent=collapsed?"▸":"▾";
  button.setAttribute("aria-expanded",String(!collapsed));
  button.title=collapsed?"Kachel ausklappen":"Kachel einklappen";
 }
 if(persist)hblPersistTileLayout();
}
function hblSetTileWidth(el,span,persist=false){
 const value=HBL_TILE_WIDTHS.includes(Number(span))?Number(span):3;
 el.dataset.tileWidth=String(value);
 el.style.setProperty("--tile-span",String(value));
 el.style.setProperty("--tile-span-compact",String(Math.min(value,6)));
 const button=el.querySelector(".tile-size");
 if(button){
  button.querySelector(".tile-size-label").textContent=({2:"⅙",3:"¼",4:"⅓",6:"½",12:"1"})[value];
  button.title="Breite ändern (Desktop: "+value+"/12 Spalten; schmaler Desktop: "+Math.min(value,6)+"/6 Spalten)";
 }
 if(persist)hblPersistTileLayout();
}
function hblCycleTileWidth(id){
 const el=hblTileById(id);if(!el)return;
 const at=HBL_TILE_WIDTHS.indexOf(Number(el.dataset.tileWidth));
 const next=HBL_TILE_WIDTHS[(at+1)%HBL_TILE_WIDTHS.length];
 hblSetTileWidth(el,next,true);
}
function hblMoveTile(id,direction){
 const tile=hblTileById(id);if(!tile)return;
 const board=tile.parentNode;
 if(direction<0){
  const prev=tile.previousElementSibling;
  if(prev)board.insertBefore(tile,prev);
 }else{
  const next=tile.nextElementSibling;
  if(next)board.insertBefore(next,tile);
 }
 hblPersistTileLayout();
 tile.querySelector(".tile-grip")?.focus({preventScroll:true});
}
function hblResetTileLayout(){
 if(!confirm("Für diese Ansicht alle Kacheln einblenden und Reihenfolge, Breite und Einklappzustand zurücksetzen?"))return;
 const board=document.getElementById("dashboardBoard");if(!board)return;
 for(const spec of HBL_TILE_SPECS){
  const tile=hblTileById(spec.id);if(!tile)continue;
  board.appendChild(tile);
  tile.hidden=false;
  hblSetTileFold(tile,false);
  hblSetTileWidth(tile,spec.span);
 }
 hblPersistTileLayout();
}
function restoreDashboardTileLayout(data){
 const board=document.getElementById("dashboardBoard");if(!board)return;
 const saved=data?.__dashboardLayoutsV2?.[hblLayoutProfile()]??data?.__dashboardLayoutV1??{};
 const names=new Set(HBL_TILE_SPECS.map(x=>x.id));
 {
  // Nur die bekannten IDs sortieren. Neue Kacheln bleiben erhalten.
  const order=new Set([...(Array.isArray(saved.order)?saved.order:[]).filter(id=>names.has(id)),...names]);
  for(const id of order){const tile=hblTileById(id);if(tile)board.appendChild(tile);}
 }
 for(const spec of HBL_TILE_SPECS){
  const tile=hblTileById(spec.id);if(!tile)continue;
  tile.hidden=(hblLayoutProfile()==="app"||!spec.core)&&Array.isArray(saved.hidden)&&saved.hidden.includes(spec.id);
  hblSetTileFold(tile,Boolean(saved.collapsed?.[spec.id]));
  hblSetTileWidth(tile,saved.widths?.[spec.id]??spec.span);
 }
}
function hblClearDropMarkers(){
 document.querySelectorAll(".tile-drop-before,.tile-drop-after,.tile-dragging")
  .forEach(n=>n.classList.remove("tile-drop-before","tile-drop-after","tile-dragging"));
}
function hblDragPosition(e,target){
 const rect=target.getBoundingClientRect();
 const nearTop=e.clientY<rect.top+Math.min(rect.height*.18,38);
 const nearBottom=e.clientY>rect.bottom-Math.min(rect.height*.18,38);
 return nearTop||(!nearBottom&&e.clientX<rect.left+rect.width*.5)?"before":"after";
}
function initializeDashboardTiles(){
 const layout=document.querySelector(".planninggrid"),oldGrid=document.querySelector("main.grid");
 if(!layout||!oldGrid)return;
 const wrapper=layout.parentNode;
 const board=document.createElement("div");board.id="dashboardBoard";board.className="dashboard-board";
 // Sichern, bevor die Ursprungscontainer entfernt werden.
 const original=HBL_TILE_SPECS.map(s=>({...s,element:document.querySelector(s.selector)}));
 if(original.some(s=>!s.element))return;
 wrapper.insertBefore(board,layout);
 for(const s of original){
  const tile=s.element;
  tile.dataset.tile=s.id;tile.classList.add("dashboard-tile");
  const bar=document.createElement("div");bar.className="tile-controls";
  const grip=document.createElement("button");grip.type="button";grip.className="tile-grip";
  grip.draggable=true;grip.title="Kachel mit gedrückter Maustaste verschieben";
  grip.setAttribute("aria-label",s.title+" verschieben");
  grip.innerHTML='⠿ <span>Ziehen</span>';
  const title=document.createElement("span");title.className="tile-collapse-title";title.textContent=s.title;
  const moveUp=document.createElement("button");moveUp.type="button";moveUp.className="tile-tool";
  moveUp.textContent="↑";moveUp.title="Kachel nach vorne verschieben";moveUp.setAttribute("aria-label",s.title+" nach vorne verschieben");
  moveUp.addEventListener("click",()=>hblMoveTile(s.id,-1));
  const moveDown=document.createElement("button");moveDown.type="button";moveDown.className="tile-tool";
  moveDown.textContent="↓";moveDown.title="Kachel nach hinten verschieben";moveDown.setAttribute("aria-label",s.title+" nach hinten verschieben");
  moveDown.addEventListener("click",()=>hblMoveTile(s.id,1));
  const size=document.createElement("button");size.type="button";size.className="tile-tool tile-size";
  size.innerHTML='↔ <span class="tile-size-label"></span>';
  size.setAttribute("aria-label",s.title+" Breite ändern");
  size.addEventListener("click",()=>hblCycleTileWidth(s.id));
  const fold=document.createElement("button");fold.type="button";fold.className="tile-tool tile-fold";
  fold.setAttribute("aria-label",s.title+" einklappen");
  fold.addEventListener("click",()=>hblSetTileFold(tile,!tile.classList.contains("tile-collapsed"),true));
  bar.append(grip,title,moveUp,moveDown,size,fold);tile.prepend(bar);
  hblSetTileWidth(tile,s.span);hblSetTileFold(tile,false);
  board.appendChild(tile);
  grip.addEventListener("dragstart",e=>{
   hblDraggedTile=tile;
   e.dataTransfer.effectAllowed="move";
   e.dataTransfer.setData("text/plain",s.id);
   tile.classList.add("tile-dragging");
  });
  grip.addEventListener("dragend",()=>{hblDraggedTile=null;hblClearDropMarkers();});
 }
 layout.remove();oldGrid.remove();
 // Alle verwaisten Zwischencontainer wurden geleert. Der Kalender usw. sind bereits im Board.
 const tools=document.querySelector(".preptools");
 if(tools){
  const bar=document.createElement("div");bar.className="board-toolbar";
  tools.classList.remove("preptools");tools.classList.add("board-status-note");
  bar.appendChild(tools);
  const help=document.createElement("span");help.className="board-help";
  help.textContent="⠿ Ziehen · ▾ Ein-/ausklappen · ↔ Breite ändern";
  const reset=document.createElement("button");reset.type="button";reset.className="board-reset";
  reset.textContent="Anordnung zurücksetzen";reset.addEventListener("click",hblResetTileLayout);
  bar.append(help,reset);
  wrapper.insertBefore(bar,board);
 }
 board.addEventListener("dragover",e=>{
  if(!hblDraggedTile)return;
  e.preventDefault();e.dataTransfer.dropEffect="move";
  const target=e.target.closest(".dashboard-tile");
  hblClearDropMarkers();hblDraggedTile.classList.add("tile-dragging");
  if(target&&target!==hblDraggedTile){
   target.classList.add(hblDragPosition(e,target)==="before"?"tile-drop-before":"tile-drop-after");
  }
 });
 board.addEventListener("drop",e=>{
  if(!hblDraggedTile)return;
  e.preventDefault();
  const target=e.target.closest(".dashboard-tile");
  const moving=hblDraggedTile;
  if(target&&target!==moving){
   const before=target.classList.contains("tile-drop-before")||hblDragPosition(e,target)==="before";
   board.insertBefore(moving,before?target:target.nextSibling);
  }else if(!target){board.appendChild(moving);}
  hblDraggedTile=null;hblClearDropMarkers();hblPersistTileLayout();
 });
 board.addEventListener("dragleave",e=>{if(!board.contains(e.relatedTarget))hblClearDropMarkers();});
 // Ohne gespeicherte Daten startet das bekannte, ursprüngliche Layout.
}

function partEsc(str){return String(str ?? "").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[ch]);}
function partId(){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,9);}
function getParticipationRoot(){
 if(!prepDone.__participation||typeof prepDone.__participation!=="object"||Array.isArray(prepDone.__participation)){
  prepDone.__participation={schema:1,classes:{}};
 }
 if(!prepDone.__participation.classes||typeof prepDone.__participation.classes!=="object")prepDone.__participation.classes={};
 return prepDone.__participation;
}
function partCourseData(create=false){
 if(!currentParticipationCourse)return null;
 const root=getParticipationRoot();
 if(!root.classes[currentParticipationCourse]&&create){root.classes[currentParticipationCourse]={students:[],dates:[],marks:{},finals:{}};}
 const c=root.classes[currentParticipationCourse];
 if(!c)return {students:[],dates:[],marks:{},finals:{}};
 if(!Array.isArray(c.students))c.students=[];
 if(!Array.isArray(c.dates))c.dates=[];
 if(!c.marks||typeof c.marks!=="object")c.marks={};
 if(!c.finals||typeof c.finals!=="object")c.finals={};
 return c;
}
// Automatisch aus dem bearbeitbaren Stundenplan berechnete Mitarbeitstermine.
function plannedParticipationDates(courseId){return typeof window.hblPlannedSlots==='function'?window.hblPlannedSlots(courseId):[];}
function fillParticipationSchedule(c,courseId){return typeof window.hblReconcileCourseDates==='function'?window.hblReconcileCourseDates(c,courseId):false;}
function partPlaceholder(name){return /^Schüler\s+[1-9]\d*$/.test(String(name).trim());}
function partStudentHasResults(c,studentId){
 if(c.finals?.[studentId]||HblGradebook.hasStudent(c.gradebook,studentId))return true;
 return Object.values(c.marks?.[studentId]||{}).some(mark=>mark&&(mark.rating||mark.comment));
}
function initializeCourseStudents(c){
 if(c.initialized)return false;
 if(!Array.isArray(c.students))c.students=[];
 if(!c.students.length){
  for(let i=1;i<=30;i++)c.students.push({id:partId(),name:`Schüler ${i}`});
 }
 c.initialized=true;
 return true;
}
function initializeParticipationRoster(){
 // Erst nach erfolgreichem Laden vom PowerShell-Server anlegen.
 // Niemals vorhandene Namen oder Bewertungen überschreiben.
 if(!serverReady||!currentParticipationCourse)return;
 const c=partCourseData(true);
 let changed=initializeCourseStudents(c);
 if(fillParticipationSchedule(c,currentParticipationCourse))changed=true;
 renderParticipationTable();

function editCourseNote(button){
 const id=button.dataset.courseId;
 const course=window.hblReadCourses().catalog.courses[id];
 if(!course)return;
 const initialData=prepDone;
 let expectedNote=course.note||"";
 const dialog=document.createElement("dialog");
 dialog.className="pcourse-note-dialog";
 dialog.setAttribute("aria-labelledby","courseNoteTitle");
 dialog.innerHTML='<form><h2 id="courseNoteTitle">Kursnotiz</h2><label><span></span><input maxlength="240" placeholder="z. B. Bruchgleichungen bis Seite 42" autocomplete="off"></label><p role="status"></p><div class="hbl-plan-buttons"><button type="submit" class="hbl-plan-primary">Speichern</button><button type="button">Abbrechen</button></div></form>';
 const form=dialog.querySelector("form"),input=form.querySelector("input");
 form.querySelector("label span").textContent=course.subject+" · "+course.group;
 input.value=expectedNote;
 form.querySelector('button[type="button"]').onclick=()=>dialog.close();
 dialog.onclose=()=>{
  dialog.remove();
  document.querySelector('.pcourse-note[data-course-id="'+CSS.escape(id)+'"]')?.focus();
 };
 form.onsubmit=async event=>{
  event.preventDefault();
  if(input.disabled)return;
  const controls=form.querySelectorAll("input,button");
  try{
   if(!serverReady||initialData!==prepDone)throw Error("Der Datenstand hat sich geändert. Bitte die Kursnotiz erneut öffnen.");
   const {catalog}=window.hblReadCourses(),current=catalog.courses[id];
   if(!current||current.archived||(current.note||"")!==expectedNote)throw Error("Der Kurs wurde geändert. Bitte die Kursnotiz erneut öffnen.");
   expectedNote=input.value.trim();
   if(expectedNote)current.note=expectedNote;
   else delete current.note;
   controls.forEach(el=>el.disabled=true);
   prepDone.__coursesV1=catalog;
   renderParticipationOverview();
   await savePrepFile();
   dialog.close();
  }catch(error){form.querySelector("[role=status]").textContent="Speichern fehlgeschlagen. "+error.message;}
  finally{controls.forEach(el=>el.disabled=false);}
 };
 dialog.oncancel=event=>{if(input.disabled)event.preventDefault();};
 document.body.appendChild(dialog);
 dialog.showModal();
 input.focus();
}
function partMark(c,studentId,dateId){return c.marks?.[studentId]?.[dateId]||{};}
function partAnalysis(c,studentId){
 const marks=c.dates.map(d=>partMark(c,studentId,d.id).rating).filter(v=>Object.hasOwn(PART_VALUES,v));
 if(!marks.length)return {avg:null,proposed:null,trend:"—",count:0};
 const nums=marks.map(v=>PART_VALUES[v]);const avg=nums.reduce((a,b)=>a+b,0)/nums.length;
 let trend="—";
 if(nums.length>=4){const old=(nums.at(-4)+nums.at(-3))/2,latest=(nums.at(-2)+nums.at(-1))/2;trend=latest<old-.3?"↗":latest>old+.3?"↘":"→";}
 return {avg,proposed:Math.round(avg),trend,count:marks.length};
}

function toggleParticipationRoster(force){
 const target=document.getElementById("participationRoster");if(!target)return;
 target.hidden=(typeof force==="boolean")?!force:!target.hidden;
 if(!target.hidden)document.getElementById("participationNewStudents").focus();
}
function participationInputNames(){
 const field=document.getElementById("participationNewStudents");
 // Excel: eine Namensspalte oder zeilenweise kopierte Namen.
 // Leerzeilen und identische Dubletten überspringen.
 const existing=new Set();
 return field.value.split(/\r?\n/).map(v=>v.split("\t")[0].trim()).filter(Boolean).filter(name=>{
  const id=name.toLocaleLowerCase("de-DE");if(existing.has(id))return false;
  existing.add(id);return true;
 });
}
function replaceParticipationRoster(){
 if(!participationCanEdit())return;
 const c=partCourseData(true),names=participationInputNames();
 if(!names.length){setParticipationStatus("Bitte zunächst Namen einfügen.",true);return;}
 if(c.students.some(student=>HblGradebook.hasStudent(c.gradebook,student.id))){setParticipationStatus("Die Liste enthält Noten. Zum Erhalt der Zuordnung bitte Namen bearbeiten oder hinzufügen.",true);return;}
 const graded=c.students.filter(student=>partStudentHasResults(c,student.id));
 const authentic=c.students.filter(student=>!partPlaceholder(student.name));
 if((graded.length||authentic.length||c.seating?.desks?.some(d=>d.seats.some(Boolean)))&&!confirm(
  `Die bisherige Klassenliste enthält ${graded.length} Person(en) mit Bewertungen/Endnoten und ${authentic.length} bereits benannte Person(en).\n\n`+
  `Die Liste wird vollständig durch ${names.length} importierte Namen ersetzt. Vorhandene Mitarbeitseinträge und Endnoten dieser Klasse werden dabei gelöscht. Bisherige Sitzplätze werden freigegeben.\n\nJetzt wirklich ersetzen?`
 ))return;
 // Komplett neue IDs: Vorherige Bewertungen werden ausdrücklich nicht
 // irrtümlich auf eine andere Person übertragen.
 c.students=names.map(name=>({id:partId(),name}));
 HblSeating.clearMissing(c.seating,c.students);
 c.marks={};c.finals={};c.initialized=true;
 document.getElementById("participationNewStudents").value="";
 toggleParticipationRoster(false);renderParticipationTable();partPersist();
}
function pruneParticipationPlaceholders(){
 if(!participationCanEdit())return;
 const c=partCourseData(true);
 const removable=c.students.filter(student=>partPlaceholder(student.name)&&!partStudentHasResults(c,student.id)&&!c.seating?.desks?.some(d=>d.seats.includes(student.id)));
 if(!removable.length){setParticipationStatus("Keine unbewerteten Platzhalter vorhanden.");return;}
 const removed=new Set(removable.map(student=>student.id));
 c.students=c.students.filter(student=>!removed.has(student.id));
 HblSeating.clearMissing(c.seating,c.students);
 for(const id of removed){delete c.marks[id];delete c.finals[id];}
 renderParticipationTable();partPersist();
}
function setParticipationMonthView(value){
 participationMonthView=value;
 renderParticipationTable();
}
function refreshParticipationMonthSelector(c){
 const select=document.getElementById("participationMonthView");
 const info=document.getElementById("participationMonthInfo");
 if(!select)return;
 const months=[...new Set(c.dates.map(d=>d.date.slice(0,7)))].sort();
 if(!months.length){
  select.innerHTML='<option value="">Termine werden geladen …</option>';
  if(info)info.textContent='Die Unterrichtstermine werden aus dem Stundenplan vorbereitet.';
  return;
 }
 let target=participationMonthView;
 if(!months.includes(target)&&target!=="all"){
  const now=taskDateString(new Date()).slice(0,7);
  target=months.find(month=>month>=now)||months.at(-1)||"all";
 }
 participationMonthView=target;
 const options=[{value:"all",label:"Gesamtes Schuljahr (alle Termine)"},
   ...months.map(month=>{const [y,m]=month.split("-").map(Number);
    const label=new Date(y,m-1,1).toLocaleDateString("de-DE",{month:"long",year:"numeric"});
    return {value:month,label};})];
 select.innerHTML=options.map(o=>`<option value="${o.value}">${partEsc(o.label)}</option>`).join("");
 select.value=target;
 const visible=target==="all"?c.dates:c.dates.filter(d=>d.date.startsWith(target));
 if(info)info.textContent=`${visible.length} von ${c.dates.length} Unterrichtsterminen · vollständige Daten bleiben gespeichert`;
}
function addParticipationStudents(){
 if(!participationCanEdit())return;
 const field=document.getElementById("participationNewStudents");const names=field.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
 if(!names.length){field.focus();return;}
 const c=partCourseData(true);
 const existing=new Set(c.students.map(s=>s.name.trim().toLocaleLowerCase("de-DE")));
 let added=0;
 for(const name of names){const normalized=name.toLocaleLowerCase("de-DE");if(existing.has(normalized))continue;
  c.students.push({id:partId(),name});existing.add(normalized);added++;
 }
 field.value="";toggleParticipationRoster(false);renderParticipationTable();
 if(added){partPersist();}else setParticipationStatus("Alle angegebenen Namen waren bereits vorhanden.");
}
function addParticipationDate(){
 if(!participationCanEdit())return;
 const value=document.getElementById("participationNewDate").value;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(value)){setParticipationStatus("Bitte ein gültiges Datum auswählen.",true);return;}
 const c=partCourseData(true);
 if(c.dates.some(d=>d.date===value)){setParticipationStatus("Dieses Datum ist bereits angelegt.",true);return;}
 c.dates.push({id:partId(),date:value});c.dates.sort((a,b)=>a.date.localeCompare(b.date));
 participationMonthView=value.slice(0,7);renderParticipationTable();partPersist();
}
function editParticipationDate(dateId,newDate){
 if(!participationCanEdit())return;
 const c=partCourseData(true),d=c.dates.find(d=>d.id===dateId);
 if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(newDate))return;
 if(c.dates.some(other=>other!==d&&other.date===newDate)){setParticipationStatus("Datum bereits vorhanden.",true);renderParticipationTable();return;}
 if(d.block){c.excludedAuto=c.excludedAuto||[];const k=d.date+'|'+d.block;if(!c.excludedAuto.includes(k))c.excludedAuto.push(k);}
 d.date=newDate;d.manual=true;d.auto=false;d.block=null;
 c.dates.sort((a,b)=>a.date.localeCompare(b.date)||(a.block||0)-(b.block||0));participationMonthView=newDate.slice(0,7);renderParticipationTable();partPersist();
}
function deleteParticipationDate(dateId){
 if(!participationCanEdit())return;
 const c=partCourseData(true),d=c.dates.find(d=>d.id===dateId);if(!d)return;
 if(!confirm("Termin "+partDateFormat(d.date)+" und alle dazugehörigen Bewertungen endgültig löschen?"))return;
 if(d.block&&!d.manual){c.excludedAuto=c.excludedAuto||[];const k=d.date+'|'+d.block;if(!c.excludedAuto.includes(k))c.excludedAuto.push(k);}
 c.dates=c.dates.filter(v=>v.id!==dateId);
 for(const marks of Object.values(c.marks))if(marks&&typeof marks==="object")delete marks[dateId];
 renderParticipationTable();partPersist();
}

function deleteParticipationStudent(id){
 if(!participationCanEdit())return;
 try{if(!removeCourseStudent(partCourseData(true),id))return;}
 catch(error){setParticipationStatus(error.message,true);return;}

function removeCourseStudent(c,id){
 const person=c.students.find(s=>s.id===id);if(!person)return false;
 if(HblGradebook.hasStudent(c.gradebook,id))throw Error("Für diese Person sind Noten hinterlegt. Die Person bleibt im Kurs.");
 if(!confirm(person.name+" aus dem Kurs entfernen? Damit werden auch alle Mitarbeitseinträge dieser Person gelöscht und ihr Sitzplatz freigegeben."))return false;
 c.students=c.students.filter(v=>v.id!==id);delete c.marks?.[id];delete c.finals?.[id];
 HblSeating.clearMissing(c.seating,c.students);
 return true;
}
function writeParticipationMark(c,studentId,dateId,rating){
 if(!c?.students.some(s=>s.id===studentId)||!c.dates.some(d=>d.id===dateId)||!PART_OPTIONS.includes(rating))return false;
 c.marks??={};
 if(!c.marks[studentId])c.marks[studentId]={};
 const previous=c.marks[studentId][dateId]||{};
 c.marks[studentId][dateId]={...previous,rating};
 return true;
}
function setParticipationMark(studentId,dateId,rating){
 if(!participationCanEdit()||!writeParticipationMark(partCourseData(true),studentId,dateId,rating))return;
 renderParticipationTable();partPersist();
}
