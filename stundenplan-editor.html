<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stundenplan – Schul-Dashboard</title>
<style>
:root{font-family:Arial,sans-serif;color:#182638;background:#f4f6fa}*{box-sizing:border-box}body{margin:0;padding:22px;max-width:1350px;margin:auto}h1{margin:0 0 6px}p{color:#566474}.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:20px 0}.button,button{border:0;background:#244d8e;color:white;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:600}button.secondary{background:#e7ebf3;color:#21364f}button.danger{background:#b23b46}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e4a53b}.scroll{overflow-x:auto}.schedule{display:grid;grid-template-columns:78px repeat(5,minmax(175px,1fr));gap:8px;min-width:1000px}.head{font-weight:bold;text-align:center;padding:12px;background:#e6ebf3;border-radius:9px}.slot{background:#e6ebf3;border-radius:9px;padding:12px 7px;text-align:center;font-weight:bold}.slot small{display:block;font-weight:normal;margin-top:5px}.cell{min-height:125px;border:1px solid #d9e0e9;background:white;border-radius:9px;padding:7px}.lesson{position:relative;border-radius:7px;padding:9px;margin-bottom:6px;border-left:5px solid #8794a5;background:#f0f2f5}.lesson.a{border-color:#289461;background:#e4f5eb}.lesson.b{border-color:#3178cf;background:#e5f0ff}.lesson strong,.lesson span{display:block}.lesson span{font-size:13px;margin-top:4px}.lesson button{background:transparent;color:#263c50;padding:3px 7px;float:right}.add{background:#f4f7fb;color:#385a82;width:100%;margin-top:5px;border:1px dashed #9cb0c7}dialog{border:0;border-radius:14px;padding:24px;width:min(450px,95vw);box-shadow:0 12px 50px #0004}dialog::backdrop{background:#15223888}label{display:block;font-weight:bold;margin:12px 0 4px}input,select{width:100%;padding:10px;border:1px solid #aeb9c9;border-radius:7px;font:inherit}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:20px}.hint{font-size:13px}.sr{position:absolute;left:-9999px}@media(max-width:700px){body{padding:12px}h1{font-size:24px}}
</style></head><body>
<h1>Mein Stundenplan</h1><p>Unterricht manuell eintragen · A-Woche grün · B-Woche blau · beide Wochen grau</p>
<div class="bar"><a href="./" class="button" style="text-decoration:none">← Dashboard</a><div><button class="secondary" id="export">JSON exportieren</button> <button class="secondary" id="import">JSON importieren</button><input type="file" id="file" accept=".json,application/json" hidden></div></div>
<p class="hint">Testversion: Daten werden nur in diesem Browser gespeichert, noch nicht in Supabase synchronisiert. Für die Übernahme auf andere Geräte bitte exportieren/importieren.</p>
<div class="scroll"><div class="schedule" id="schedule"></div></div>
<dialog id="editor"><form id="form"><h2 id="dialogtitle">Unterricht eintragen</h2><input type="hidden" id="id"><input type="hidden" id="day"><input type="hidden" id="block"><label for="subject">Fach</label><input id="subject" maxlength="80" required placeholder="z. B. Physik"><label for="classroom">Klasse</label><input id="classroom" maxlength="40" required placeholder="z. B. 9a"><label for="room">Raum</label><input id="room" maxlength="40" placeholder="z. B. 204"><label for="week">Wochenrhythmus</label><select id="week"><option value="both">A- und B-Woche</option><option value="a">Nur A-Woche</option><option value="b">Nur B-Woche</option></select><div class="actions"><button type="button" class="danger" id="remove" hidden>Löschen</button><div style="margin-left:auto"><button type="button" class="secondary" id="cancel">Abbrechen</button> <button type="submit">Speichern</button></div></div></form></dialog>
<script>
(()=>{'use strict';
const KEY='hbl_timetable_manual_v1',days=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'],times=['08:15','10:05','12:20','14:00'];
const el=id=>document.getElementById(id);let entries=[];
try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(raw))entries=raw.filter(valid)}catch{}
function valid(x){return x&&typeof x==='object'&&typeof x.id==='string'&&Number.isInteger(x.day)&&x.day>=0&&x.day<5&&Number.isInteger(x.block)&&x.block>=0&&x.block<4&&typeof x.subject==='string'&&typeof x.classroom==='string'&&typeof x.room==='string'&&['a','b','both'].includes(x.week)}
function save(){localStorage.setItem(KEY,JSON.stringify(entries))}
function node(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function draw(){const root=el('schedule');root.replaceChildren(node('div','head','Block'));days.forEach(d=>root.append(node('div','head',d)));
for(let block=0;block<4;block++){const s=node('div','slot',String(block+1));s.append(node('small','',times[block]));root.append(s);
for(let day=0;day<5;day++){const cell=node('div','cell');entries.filter(e=>e.day===day&&e.block===block).sort((a,b)=>['a','b','both'].indexOf(a.week)-['a','b','both'].indexOf(b.week)).forEach(e=>{const card=node('div','lesson '+e.week);const edit=node('button','','✎');edit.type='button';edit.setAttribute('aria-label','Eintrag bearbeiten');edit.onclick=()=>open(e);card.append(edit,node('strong','',e.subject),node('span','',e.classroom+(e.room?' · Raum '+e.room:'')),node('span','',e.week==='a'?'A-Woche':e.week==='b'?'B-Woche':'A- und B-Woche'));cell.append(card)});
const add=node('button','add','+ Stunde');add.type='button';add.onclick=()=>open(null,day,block);cell.append(add);root.append(cell)}}}
function open(e,day,block){el('form').reset();el('id').value=e?.id||'';el('day').value=e?.day??day;el('block').value=e?.block??block;el('subject').value=e?.subject||'';el('classroom').value=e?.classroom||'';el('room').value=e?.room||'';el('week').value=e?.week||'both';el('remove').hidden=!e;el('dialogtitle').textContent=e?'Unterricht bearbeiten':'Unterricht eintragen';el('editor').showModal()}
el('cancel').onclick=()=>el('editor').close();
el('form').onsubmit=ev=>{ev.preventDefault();const id=el('id').value||((crypto.randomUUID&&crypto.randomUUID())||Date.now()+'-'+Math.random());const item={id,day:Number(el('day').value),block:Number(el('block').value),subject:el('subject').value.trim(),classroom:el('classroom').value.trim(),room:el('room').value.trim(),week:el('week').value};if(!item.subject||!item.classroom)return;const conflicts=entries.filter(e=>e.id!==id&&e.day===item.day&&e.block===item.block&&(e.week===item.week||e.week==='both'||item.week==='both'));if(conflicts.length&&!confirm('In diesem Block ist für diese Woche bereits Unterricht eingetragen. Trotzdem speichern?'))return;entries=entries.filter(e=>e.id!==id);entries.push(item);save();draw();el('editor').close()};
el('remove').onclick=()=>{if(confirm('Diesen Eintrag wirklich löschen?')){entries=entries.filter(e=>e.id!==el('id').value);save();draw();el('editor').close()}};
el('export').onclick=()=>{const blob=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='stundenplan.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
el('import').onclick=()=>el('file').click();el('file').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(valid))throw Error('Ungültiges Format');if(confirm('Den aktuellen Stundenplan durch die importierten Daten ersetzen?')){entries=data;save();draw()}}catch(e){alert('Import fehlgeschlagen: '+e.message)}ev.target.value=''};draw();
})();
</script></body></html>
