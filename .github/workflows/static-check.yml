name: Static checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Statischen Offline-Check ausführen
        run: npm test
      - name: Node.js für Chrome-Browserprüfung bereitstellen
        if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Navigation in Android-Emulation und Desktop-Chrome prüfen
        if: runner.os == 'Linux'
        env:
          CHROME_PATH: google-chrome
        run: |
          node scripts/check-navigation.mjs
          node scripts/check-navigation.mjs --desktop
