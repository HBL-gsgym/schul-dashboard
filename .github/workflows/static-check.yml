name: Static checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Statischen Offline-Check ausfÃ¼hren
        run: npm test
      - name: Node.js fÃ¼r Chrome-BrowserprÃ¼fung bereitstellen
        if: runner.os == 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Navigation in Android-Emulation und Desktop-Chrome prÃ¼fen
        if: runner.os == 'Windows'
        env:
          CHROME_PATH: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
        run: |
          node scripts/check-navigation.mjs
          node scripts/check-navigation.mjs --desktop
