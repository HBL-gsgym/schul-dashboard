name: Static checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Statischen Offline-Check ausführen
        run: npm test
